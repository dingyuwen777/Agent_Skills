interface:
  display_name: "Analysis"
  short_description: "第一性原理、前提审计、决策与最小充分方案"
  default_prompt: "Analyze from current facts and user constraints. Challenge premises when evidence conflicts. Separate confirmed facts, inference, recommendations, and unknowns. Use first principles when it improves the answer. Prefer the smallest sufficient actionable solution; for complex goals, distinguish an immediate solution from an ideal later-state only when useful. Keep the answer concise and stop when further analysis would not change the decision. Validation must match the claim."
