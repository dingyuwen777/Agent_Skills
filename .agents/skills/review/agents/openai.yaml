interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Load current project review constraints and facts; recover review lineage before formal review and distinguish first review, re-review, or new baseline from PR/Requirement/head evidence. A clean first review may return no blocking Findings; never manufacture findings or nit-driven repair. On first review, complete the current-scope batch before publishing Findings; do not publish partial findings. On re-review, verify original Findings, reviewed_head-to-repair_head diff / repair diff, adjacent regressions and current Acceptance; admitted Repair Packages should already have blind pre-review and baseline challenge. If unchanged-baseline or repair-package escape exposes review-process failure, self-recover internally before a normal terminal; do not reopen unchanged old baseline as full review. Default review-only; review-and-test uses current testing workflow, review-and-fix returns authorized fixes to development. Never claim boundaries that were not actually run, and never infer write, commit, merge, release, or deployment authorization."
