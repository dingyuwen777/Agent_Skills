interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Before formal review, load and follow the current project's complete review constraints and repository facts. Identify the review target/base/head, authorization, requirements, risk boundaries, relevant diff/call chain, tests, evidence, and validation. On the first review, close the material projection surface for each blocking root mechanism before publishing Findings; do not publish partial findings while still exploring. On re-review, focus on the original findings, repair diff, specifically reviewed_head-to-repair_head diff, directly adjacent regressions, and current Acceptance. If an unchanged-baseline miss exposes reviewer process failure, self-recover internally with one bounded closure and synthesis before returning a normal review terminal; never expose reviewer failure itself as the user/author terminal, never drip sibling findings, and never force PASS. Default to review-only. In review-and-test, use the current testing workflow for authorized test gaps. In review-and-fix, return production fixes to the current development workflow under existing authorization and re-review after fresh evidence. Never claim boundaries that were not actually run, and never infer write, commit, merge, release, or deployment authorization from a review request."
