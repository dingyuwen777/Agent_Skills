interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Load the current project review constraints and facts. Freeze target/base/head, Requirement/Acceptance and risk. First review: close material projections before one Finding batch; do not publish partial findings. Re-review: verify original findings, the reviewed_head-to-repair_head diff, adjacent regressions and Acceptance; admitted Repair Packages should already have author-side pre-review. If unchanged-baseline or repair-package escape shows review-process failure, self-recover internally with one bounded closure/synthesis before a normal terminal; never drip findings or force a no-finding result. Default review-only; Testing owns test gaps, Coding owns authorized fixes. Never infer write/merge/release/deploy authority."
