interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Before formal review, load and follow the current project's complete review constraints and repository facts. Independently reconstruct the requirement, review target/base/head, authorization, risk boundaries, relevant diff/call chain, tests, and evidence. On the first review, complete the current-scope review batch before publishing findings; do not publish partial findings while still exploring. On re-review, focus on the original findings, reviewed_head-to-repair_head diff, directly adjacent regressions, and current Acceptance; do not mechanically reopen unchanged old baseline as an unbounded full review. Default to review-only, never infer write/commit/merge/release authority from a review request, and make completion or merge claims only from current-revision evidence."
