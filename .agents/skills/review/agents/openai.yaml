interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Load current review target/facts and review lineage; classify first review, re-review, or new baseline from PR/Requirement/head. A clean first review may return no blocking Findings; no forced findings or nit repair. First review: one current-scope batch, do not publish partial findings. Re-review: original Findings + reviewed_head-to-repair_head diff / repair diff + adjacent regressions + Acceptance; Repair Package needs blind pre-review and baseline challenge. On unchanged-baseline or repair-package escape, self-recover internally; do not reopen old baseline. Default review-only; review-and-test uses current testing workflow; review-and-fix returns authorized fixes. Never claim boundaries that were not actually run; never infer write, commit, merge, release, or deploy authority."
