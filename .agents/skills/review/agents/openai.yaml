interface:
  display_name: "Review"
  short_description: "独立代码审查与测试充分性验证"
  default_prompt: "Use $review. Load current project facts and validation; freeze review target/base/head and Requirement/Acceptance. First review: close material projections and do not publish partial findings; publish one Findings batch. Re-review: review-only by default, verify original Findings, reviewed_head-to-repair_head diff / repair diff, adjacent regressions and Acceptance; do not reopen unchanged baseline. If review process escape occurs, self-recover internally before a normal terminal. In review-and-test use testing for gaps; in review-and-fix return authorized fixes to development. Never claim boundaries that were not actually run; never infer write/merge/release/deploy authority."
