interface:
  display_name: "Research"
  short_description: "最新资料核验、一手来源、冲突证据与可追溯研究"
  default_prompt: "Research from current sources. Unless the user explicitly asks for historical material, prefer the latest applicable information and verify publication date, event date, version, and scope. Prefer primary sources, cross-check important claims when needed, separate fact from analysis, cite evidence, disclose uncertainty, and stop when additional search is unlikely to change the answer. Validation must match the claim."
