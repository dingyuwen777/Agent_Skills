name: Temporary Machine Verify Release Immutability

on:
  push:
    branches:
      - fix/release-immutability-preflight-auth
    paths:
      - .github/workflows/tmp-machine-verify-release-immutability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-immutability-preflight-auth
          persist-credentials: true

      - name: Apply machine-only Immutability preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import indent

          release_path = Path(".github/workflows/release.yml")
          release = release_path.read_text(encoding="utf-8")

          confirm_input = (
              "      confirm_immutable_releases:\n"
              "        description: \"确认 Settings > Releases 已启用 Release Immutability（未配置管理员只读 Token 时必选）\"\n"
              "        required: true\n"
              "        default: false\n"
              "        type: boolean\n"
          )
          if confirm_input not in release:
              raise SystemExit("confirm input block not found")
          release = release.replace(confirm_input, "", 1)

          confirm_env = "          IMMUTABILITY_CONFIRMED: ${{ inputs.confirm_immutable_releases }}\n"
          if confirm_env not in release:
              raise SystemExit("confirm env line not found")
          release = release.replace(confirm_env, "", 1)

          lines = release.splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines) if line == '          settings_token="${GH_TOKEN}"\n'), None)
          if start is None:
              raise SystemExit("old Immutability block start not found")
          end = next((i for i in range(start, len(lines)) if lines[i] == "          esac\n"), None)
          if end is None:
              raise SystemExit("old Immutability block end not found")

          shell_lines = [
              'if [ -z "${RELEASE_SETTINGS_TOKEN}" ]; then',
              '  echo "缺少 RELEASE_SETTINGS_TOKEN；请在仓库 Actions secrets 中配置仅授权当前仓库且具备 Administration: read 的 fine-grained PAT 后再发布" >&2',
              '  exit 1',
              'fi',
              'immutable_response="${RUNNER_TEMP}/immutable-releases.json"',
              'if ! immutable_status="$(' ,
              '  curl --silent --show-error \\',
              '    --output "${immutable_response}" \\',
              '    --write-out "%{http_code}" \\',
              '    -H "Accept: application/vnd.github+json" \\',
              '    -H "Authorization: Bearer ${RELEASE_SETTINGS_TOKEN}" \\',
              '    -H "X-GitHub-Api-Version: 2026-03-10" \\',
              '    "https://api.github.com/repos/${GITHUB_REPOSITORY}/immutable-releases"',
              ')"; then',
              '  echo "Release Immutability API 请求失败；无法确认仓库设置，停止发布" >&2',
              '  exit 1',
              'fi',
              'case "${immutable_status}" in',
              '  200)',
              '    jq -e \'.enabled == true\' "${immutable_response}" >/dev/null || {',
              '      echo "Release Immutability API 返回 200，但 enabled 不是 true；停止发布" >&2',
              '      exit 1',
              '    }',
              '    echo "已通过 RELEASE_SETTINGS_TOKEN 机器确认 Release Immutability 已启用"',
              '    ;;',
              '  404)',
              '    echo "当前仓库未启用 GitHub Release Immutability；请先在 Settings > Releases 启用后再发布" >&2',
              '    exit 1',
              '    ;;',
              '  403)',
              '    echo "RELEASE_SETTINGS_TOKEN 权限不足；该 Token 必须仅按需要授权当前仓库并具备 Administration: read" >&2',
              '    exit 1',
              '    ;;',
              '  *)',
              '    echo "检查 Release Immutability 失败：HTTP ${immutable_status}；无法确认设置，停止发布" >&2',
              '    exit 1',
              '    ;;',
              'esac',
          ]
          lines[start : end + 1] = [indent("\n".join(shell_lines) + "\n", "          ")]
          release_path.write_text("".join(lines), encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_readme = "Release workflow 对 Release Immutability 采用 fail-closed。GitHub 官方的仓库设置检查 API 需要 `Administration: read`，而默认 `GITHUB_TOKEN` 不具备读取该管理设置的权限；因此 Preflight 优先使用可选仓库 Secret `RELEASE_SETTINGS_TOKEN`（建议使用仅授权本仓库、`Administration: read` 的 fine-grained PAT）做机器验证。若没有配置该 Secret，默认 Token 返回 403 时不会再误报“未启用”，而是要求本次手工运行显式勾选 `confirm_immutable_releases`，确认维护者已经在 `Settings > Releases` 打开该设置；真正的 404 仍表示未启用并立即失败。\n\n无论 Preflight 使用机器验证还是显式人工确认，正式发布后仍必须从 GitHub Release API 验证 `immutable=true`；Draft→资产校验→Publish、tag/资产核对和失败时只清理未发布 Draft 的边界保持不变。"
          new_readme = "Release workflow 对 Release Immutability 采用 fail-closed。GitHub 官方的仓库设置检查 API 需要 `Administration: read`，而默认 `GITHUB_TOKEN` 不具备读取该管理设置的权限；因此正式 Release 前必须配置仓库 Actions Secret `RELEASE_SETTINGS_TOKEN`。建议使用只授权 `dingyuwen777/Agent_Skills`、Repository permission 仅设置 `Administration: Read-only` 的 fine-grained PAT。这个 Secret 只用于 Preflight 读取 Immutability 仓库设置，不用于创建 tag、上传资产或 Publish Release；实际发布仍使用当前 workflow 的 `github.token` 和最小 `contents: write` 权限。\n\nPreflight 在 Secret 缺失、403 权限不足、404 未启用或其他无法确认状态时都会在三平台正式构建前失败；只有 API 返回 200 且 `enabled=true` 才继续。正式发布后仍会从 GitHub Release API 再验证 `immutable=true`；Draft→资产校验→Publish、tag/资产核对和失败时只清理未发布 Draft 的边界保持不变。"
          if old_readme not in readme:
              raise SystemExit("README manual fallback text not found")
          readme_path.write_text(readme.replace(old_readme, new_readme, 1), encoding="utf-8")

          ref_path = Path(".agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md")
          ref = ref_path.read_text(encoding="utf-8")
          old_ref = "Release workflow 必须从 main 构建，在正式构建前校验 tag 不存在、Release 不存在并确认 Release Immutability 已启用，再在目标 main SHA 上重新运行完整 self-contained tests 与 Ready Check。GitHub 官方仓库 Immutability 设置 API 要求 `Administration: read`，默认只具备普通仓库权限的 `GITHUB_TOKEN` 得到 403 时只能证明权限不足，**不能解释成未启用**：workflow 优先使用可选的管理员只读 `RELEASE_SETTINGS_TOKEN` 做机器确认；未配置该 Secret 时，只有本次 `workflow_dispatch` 明确确认已经在仓库 Settings 启用 Immutability 才允许在 403 权限边界下继续，机器可确认的 404 仍必须失败关闭；如果已经配置 `RELEASE_SETTINGS_TOKEN` 但仍返回 403，则必须停止并修正 Token 权限，不能降级成人工确认。三平台继续使用同一固定 Python 版本，且 identity 必须满足 `source_commit == GITHUB_SHA`、`release_version == tag 去 v 后值`、artifact SHA256 和协议/digest 一致。"
          new_ref = "Release workflow 必须从 main 构建，在正式构建前校验 tag 不存在、Release 不存在并**机器确认** Release Immutability 已启用，再在目标 main SHA 上重新运行完整 self-contained tests 与 Ready Check。GitHub 官方仓库 Immutability 设置 API 要求 `Administration: read`，默认 `GITHUB_TOKEN` 的普通仓库权限不足以读取这个管理设置，因此正式 Release 必须提供仓库 Actions Secret `RELEASE_SETTINGS_TOKEN`，推荐使用只授权当前仓库且仅具备 `Administration: read` 的 fine-grained PAT；该 Secret 只用于 Preflight 读取设置，不得替代 `github.token` 执行 tag/Release 发布。Secret 缺失、403 权限不足、机器可确认的 404 未启用或其他无法确认状态都必须在正式构建前失败关闭，不能降级为人工勾选或口头确认；只有 API 返回 200 且 `enabled=true` 才继续。三平台继续使用同一固定 Python 版本，且 identity 必须满足 `source_commit == GITHUB_SHA`、`release_version == tag 去 v 后值`、artifact SHA256 和协议/digest 一致。"
          if old_ref not in ref:
              raise SystemExit("ref13 manual fallback text not found")
          ref_path.write_text(ref.replace(old_ref, new_ref, 1), encoding="utf-8")
          PY

      - name: Verify release hardening regression
        run: >-
          python -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_runtime_release_hardening.py'
          -v

      - name: Commit verified machine preflight fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml README.md .agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md
          git diff --cached --check
          git commit -m "收紧 Release Immutability 机器预检"
          git push origin HEAD:fix/release-immutability-preflight-auth
