name: Temporary Machine Verify Release Immutability

on:
  push:
    branches:
      - fix/release-immutability-preflight-auth
    paths:
      - .github/workflows/tmp-machine-verify-release-immutability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-immutability-preflight-auth
          persist-credentials: true

      - name: Apply machine-only Immutability preflight
        run: python .tmp_release_immutability_patch.py

      - name: Verify release hardening regression
        run: >-
          python -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_runtime_release_hardening.py'
          -v

      - name: Commit verified machine preflight fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml README.md .agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md
          git diff --cached --check
          git commit -m "收紧 Release Immutability 机器预检"
          git push origin HEAD:fix/release-immutability-preflight-auth
