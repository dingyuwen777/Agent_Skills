name: Temporary Maintenance CI Patch

on:
  push:
    branches:
      - ci/234-evidence-selector-phase2
    paths:
      - .github/workflows/_maintenance_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/234-evidence-selector-phase2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply Maintenance update
        run: python .github/scripts/_patch_maintenance_ci_phase2.py

      - name: Verify exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".agents/MAINTENANCE.md"

      - name: Commit Maintenance update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent Skills CI Maintainer"
          git config user.email "agent-skills-ci-maintainer@users.noreply.github.com"
          git add .agents/MAINTENANCE.md
          git commit -m "固化 CI Test Impact 维护规则"
          git push origin HEAD:ci/234-evidence-selector-phase2
