name: CI238 Apply

on:
  push:
    branches:
      - ci/238-runtime-package-gate-zero-runner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/238-runtime-package-gate-zero-runner
          fetch-depth: 0
          persist-credentials: true

      - name: Apply scoped patch and remove temporary assets
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/_ci238_patch.py
          git rm .github/scripts/_ci238_patch.py .github/workflows/_ci238_apply.yml
          git diff --check
          git status --short
          git config user.name "yuwen.ding"
          git config user.email "dingyuwen777@gmail.com"
          git add -A
          git commit -m "优化非 Package required Gate Runner"
          git push origin HEAD:ci/238-runtime-package-gate-zero-runner
