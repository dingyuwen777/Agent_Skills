name: Temp Fix 238 Ready Enforcement

on:
  push:
    branches:
      - fix/238-nonpackage-ready-enforcement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/238-nonpackage-ready-enforcement
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.7"
      - name: Apply corrective patch
        run: python scripts/_tmp_fix238_ready_v2.py
      - name: Remove temporary workflow before canonical workflow-set regression
        run: rm .github/workflows/tmp-fix238-ready.yml
      - name: Run focused regression
        run: |
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_ci_ready_evidence_order.py' -v
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_ci_workflow_minimal_sufficiency.py' -v
          git diff --check
      - name: Commit and attempt branch update
        run: |
          rm -f scripts/_tmp_fix238_ready.py scripts/_tmp_fix238_ready_v2.py .github/workflows/tmp-fix238-ready.yml
          git config user.name "dingyuwen777"
          git config user.email "dingyuwen777@users.noreply.github.com"
          git add -A
          git commit -m "修复 non-package Change Ready 强制门禁"
          git push origin HEAD:fix/238-nonpackage-ready-enforcement
