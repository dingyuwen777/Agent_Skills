name: Temporary Restore Web Source Marker

on:
  push:
    branches:
      - chore/source-mode-installed-assets-noncanonical

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/source-mode-installed-assets-noncanonical
          fetch-depth: 0
      - name: Restore marker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md')
          text = path.read_text(encoding='utf-8')
          old = '该路径不调用本地六个 MCP Tool；目标项目安装资产只作安装状态事实'
          new = '该路径是源码直接读取模式，不调用本地六个 MCP Tool；目标项目安装资产只作安装状态事实'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_skill_router_single_source.py' -v
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_source_mode_installed_assets_noncanonical.py' -v
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md
          git commit -m "恢复网页端Source Mode源码直读语义"
          git push origin HEAD:chore/source-mode-installed-assets-noncanonical
