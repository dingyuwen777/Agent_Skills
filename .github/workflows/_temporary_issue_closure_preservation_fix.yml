name: Temporary Issue Closure Preservation Fix

on:
  push:
    branches:
      - chg/issue-acceptance-closure-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: chg/issue-acceptance-closure-contract
          fetch-depth: 0
      - name: Preserve legacy closure semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.agents/skills/coding/references/17_需求来源与PR追溯治理.md')
          text = path.read_text(encoding='utf-8')
          needle = 'Agent 关闭 Issue/工单 Requirement Source 为 `completed` / `resolved` 前，先取得项目要求的 post-merge evidence。Acceptance Criteria 仍由 Requirement Source 自己拥有，Closure Audit 必须把 Evidence 反向同步到该正式 Owner，而不是只在 Change/PR/最终回复里声明完成。'
          replacement = needle + '\n\n本节继续保留原有完成门禁：必须**逐条核对**验收标准，**只有实际证据支持**的项才能完成；状态同步必须**先回写** Requirement Source 再重读确认。仍有适用但未满足、`partial`、`unverified` 或 `unresolved` 的 AC 且没有正式 N/A / deferred 处置时，**不得以 completed / resolved 关闭**整个 Requirement Source。'
          if text.count(needle) != 1:
              raise SystemExit(f'closure anchor count={text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_pr_requirement_traceability.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/coding/references/17_需求来源与PR追溯治理.md
          git commit -m '保留 Issue Closure Audit 既有完成语义'
          git push origin HEAD:chg/issue-acceptance-closure-contract
