name: Temporary Normalize Markdown Navigation

on:
  push:
    branches:
      - chore/clickable-markdown-navigation
    paths:
      - '.github/scripts/normalize_markdown_navigation.py'
      - '.github/workflows/temporary-normalize-markdown-navigation.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/clickable-markdown-navigation
          fetch-depth: 0

      - name: Normalize Markdown navigation
        run: python3 .github/scripts/normalize_markdown_navigation.py

      - name: Validate generated diff
        run: git diff --check

      - name: Commit normalized Markdown
        shell: bash
        run: |
          if git diff --quiet -- '*.md'; then
            echo '没有需要提交的 Markdown 变化。'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          git commit -m '统一 Markdown 可点击导航'
          git push origin HEAD:chore/clickable-markdown-navigation
