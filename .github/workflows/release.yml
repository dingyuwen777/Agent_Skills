name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v2.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-skills-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Release Request
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Validate manual tag and release identity
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Release Workflow 只能从 main 分支手工运行；当前 ref=${GITHUB_REF}" >&2
            exit 1
          }
          TAG="${INPUT_TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须使用 v<SemVer>，例如 v2.0.0；当前值=${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          test -f USAGE.md || {
            echo "缺少 Release 最终用户说明 USAGE.md" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "checkout HEAD 与 GITHUB_SHA 不一致" >&2
            exit 1
          }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag 已存在，拒绝覆盖：${TAG}" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，拒绝覆盖：${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run full self-contained tests
        run: >-
          python -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_*.py'
          -v

      - name: Verify release Ready gate
        run: python .agents/skills/coding/scripts/ready_check.py --root .

  runtime-linux:
    name: Release Runtime Linux
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and verify Linux single binary
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          name="agent-skills-mcp-v${RELEASE_VERSION}-linux"
          python scripts/build_runtime.py --output-dir .runtime-dist --name "${name}" --release-version "${RELEASE_VERSION}" --json
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/${name}"
          identity="${GITHUB_WORKSPACE}/.runtime-dist/${name}.manifest.json"
          "${artifact}" status --json
          "${artifact}" self-test --json
          python scripts/runtime_mcp_smoke.py --artifact "${artifact}" --json

          target="${RUNNER_TEMP}/agent-skills-release-target"
          mkdir -p "${target}"
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          python scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          mkdir -p release-assets
          cp "${artifact}" "release-assets/${name}"
          cp "${identity}" "release-assets/${name}.manifest.json"

      - name: Upload Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-linux
          path: |
            release-assets/agent-skills-mcp-v*-linux
            release-assets/agent-skills-mcp-v*-linux.manifest.json
          if-no-files-found: error
          compression-level: 0

  runtime-windows:
    name: Release Runtime Windows
    needs: preflight
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and verify Windows single binary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $name = "agent-skills-mcp-v$env:RELEASE_VERSION-windows"
          python scripts/build_runtime.py --output-dir .runtime-dist --name $name --release-version $env:RELEASE_VERSION --json
          $artifact = (Resolve-Path ".\.runtime-dist\$name.exe").Path
          $identity = (Resolve-Path ".\.runtime-dist\$name.manifest.json").Path
          & $artifact status --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime status 失败" }
          & $artifact self-test --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime self-test 失败" }
          python scripts/runtime_mcp_smoke.py --artifact $artifact --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime MCP smoke 失败" }

          $target = Join-Path $env:RUNNER_TEMP "agent-skills-release-target"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目安装失败" }
          $installedRuntime = Join-Path $target ".agents\runtime\agent-skills-mcp.exe"
          python scripts/runtime_mcp_smoke.py --artifact $installedRuntime --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime MCP smoke 失败" }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $artifact "release-assets\$name.exe"
          Copy-Item $identity "release-assets\$name.manifest.json"

      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-windows
          path: |
            release-assets/agent-skills-mcp-v*-windows.exe
            release-assets/agent-skills-mcp-v*-windows.manifest.json
          if-no-files-found: error
          compression-level: 0

  runtime-macos:
    name: Release Runtime macOS
    needs: preflight
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and verify macOS single binary
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          name="agent-skills-mcp-v${RELEASE_VERSION}-macos"
          python scripts/build_runtime.py --output-dir .runtime-dist --name "${name}" --release-version "${RELEASE_VERSION}" --json
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/${name}"
          identity="${GITHUB_WORKSPACE}/.runtime-dist/${name}.manifest.json"
          "${artifact}" status --json
          "${artifact}" self-test --json
          python scripts/runtime_mcp_smoke.py --artifact "${artifact}" --json

          target="${RUNNER_TEMP}/agent-skills-release-target"
          mkdir -p "${target}"
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          python scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          mkdir -p release-assets
          cp "${artifact}" "release-assets/${name}"
          cp "${identity}" "release-assets/${name}.manifest.json"

      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-macos
          path: |
            release-assets/agent-skills-mcp-v*-macos
            release-assets/agent-skills-mcp-v*-macos.manifest.json
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [preflight, runtime-linux, runtime-windows, runtime-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-runtime-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Include end-user guide
        run: cp USAGE.md release-assets/USAGE.md

      - name: Validate release identity and assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          expected=(
            "agent-skills-mcp-v${RELEASE_VERSION}-linux"
            "agent-skills-mcp-v${RELEASE_VERSION}-linux.manifest.json"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.exe"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.manifest.json"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos.manifest.json"
            "USAGE.md"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/${asset}" || { echo "missing release asset: ${asset}" >&2; exit 1; }
          done
          binaries=(
            "agent-skills-mcp-v${RELEASE_VERSION}-linux"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.exe"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos"
          )
          identities=(
            "agent-skills-mcp-v${RELEASE_VERSION}-linux.manifest.json"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.manifest.json"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos.manifest.json"
          )
          normalized_identities=()
          for index in "${!binaries[@]}"; do
            binary="${binaries[$index]}"
            identity="${identities[$index]}"
            if ! jq -e \
              --arg version "${RELEASE_VERSION}" \
              --arg commit "${GITHUB_SHA}" \
              --arg artifact "${binary}" \
              '.schema == "agent-skills-runtime-release-identity/v1"
               and .release_version == $version
               and .source_commit == $commit
               and .artifact == $artifact
               and .python_version == "3.12.10"
               and .bundle_schema == "agent-skills-runtime-bundle/v2"
               and (.bundle_version | test("^[0-9a-f]{16}$"))
               and ."TaskRoute协议" == "Agent Skills 任务路由/v1"
               and ."RoutingManifest协议" == "Agent Skills 路由清单/v1"
               and ."MCP工具契约协议" == "Agent Skills MCP工具契约/v3"
               and .project_payload_schema == "agent-skills-project-payload/v2"
               and .install_manifest_schema == "agent-skills-install/v3"
               and (.source_digest | test("^[0-9a-f]{64}$"))
               and (."Routing摘要" | test("^[0-9a-f]{64}$"))
               and (.payload_digest | test("^[0-9a-f]{64}$"))' \
              "release-assets/${identity}" >/dev/null; then
              echo "Release identity 字段校验失败：${identity}" >&2
              jq . "release-assets/${identity}" >&2 || true
              exit 1
            fi
            recorded_sha="$(jq -r '.artifact_sha256' "release-assets/${identity}")"
            actual_sha="$(sha256sum "release-assets/${binary}" | awk '{print $1}')"
            test "${recorded_sha}" = "${actual_sha}" || {
              echo "Release identity artifact SHA256 不一致：${binary}" >&2
              exit 1
            }
            normalized_identity="release-assets/${identity}.common"
            jq -S 'del(.artifact, .artifact_sha256)' \
              "release-assets/${identity}" > "${normalized_identity}"
            normalized_identities+=("${normalized_identity}")
          done
          reference_identity="${normalized_identities[0]}"
          for candidate_identity in "${normalized_identities[@]:1}"; do
            if ! cmp -s "${reference_identity}" "${candidate_identity}"; then
              echo "三平台 Release identity 不一致：${reference_identity} <> ${candidate_identity}" >&2
              diff -u "${reference_identity}" "${candidate_identity}" >&2 || true
              exit 1
            fi
          done
          # Identity manifest 只用于跨平台构建校验；正式 Release 最终收敛为单 ZIP。
          rm release-assets/*.manifest.json release-assets/*.manifest.json.common
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "tag 已存在，拒绝覆盖：${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，拒绝覆盖：${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Build single distribution ZIP
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "agent-skills-mcp-v${RELEASE_VERSION}-linux"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.exe"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos"
            "USAGE.md"
          )
          for asset in "${assets[@]}"; do
            test -f "release-assets/${asset}" || {
              echo "缺少 ZIP 输入资产：${asset}" >&2
              exit 1
            }
          done
          (
            cd release-assets
            sha256sum "${assets[@]}" > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 4
          )
          mkdir -p release-package
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          expected = [
              f"agent-skills-mcp-v{version}-linux",
              f"agent-skills-mcp-v{version}-windows.exe",
              f"agent-skills-mcp-v{version}-macos",
              "USAGE.md",
              "SHA256SUMS",
          ]
          source = Path("release-assets")
          package = Path("release-package") / f"agent-skills-v{version}.zip"
          with zipfile.ZipFile(
              package,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as archive:
              for name in expected:
                  archive.write(source / name, arcname=name)
          with zipfile.ZipFile(package) as archive:
              actual = archive.namelist()
          if actual != expected:
              raise SystemExit(f"ZIP 成员集合不正确：{actual}")
          PY

      - name: Create verified draft Release
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_package="agent-skills-v${RELEASE_TAG#v}.zip"
          test -f "release-package/${expected_package}" || {
            echo "缺少最终 ZIP：${expected_package}" >&2
            exit 1
          }
          gh release create "${RELEASE_TAG}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Agent_Skills ${RELEASE_TAG}" \
            --notes-file USAGE.md
          gh release upload "${RELEASE_TAG}" release-package/agent-skills-v*.zip
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" = "true"
          draft_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          test "${draft_assets}" = "${expected_package}" || {
            echo "Draft Release 资产集合不正确：${draft_assets}" >&2
            exit 1
          }

      - name: Publish GitHub Release
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_package="agent-skills-v${RELEASE_TAG#v}.zip"
          gh release edit "${RELEASE_TAG}" --draft=false
          git fetch --tags
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" = "false"
          published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          test "${published_assets}" = "${expected_package}" || {
            echo "Release 已发布资产集合不正确：${published_assets}" >&2
            exit 1
          }
          gh release view "${RELEASE_TAG}" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets

      - name: Cleanup failed draft Release
        if: failure()
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "${is_draft}" = "true" ]; then
            echo "清理本次失败后遗留的未发布 Draft Release：${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" --cleanup-tag --yes
          fi
