name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-skills-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Release Request
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate manual tag and release identity
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Release Workflow 只能从 main 分支手工运行；当前 ref=${GITHUB_REF}" >&2
            exit 1
          }
          TAG="${INPUT_TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag 必须使用 v<SemVer>，例如 v1.0.0；当前值=${TAG}" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          test "${VERSION}" = "${FILE_VERSION}" || {
            echo "输入 tag ${TAG} 与仓库 VERSION=${FILE_VERSION} 不一致" >&2
            exit 1
          }
          test -f USAGE.md || {
            echo "缺少 Release 最终用户说明 USAGE.md" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}" || {
            echo "checkout HEAD 与 GITHUB_SHA 不一致" >&2
            exit 1
          }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag 已存在，拒绝覆盖：${TAG}" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，拒绝覆盖：${TAG}" >&2
            exit 1
          fi
          python3 .agents/skills/coding/scripts/ready_check.py --root .
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  runtime-linux:
    name: Release Runtime Linux
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtime build dependencies
        run: python3 -m pip install -r runtime/requirements-build.txt

      - name: Build and verify Linux single binary
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build_runtime.py --output-dir .runtime-dist --json
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          "${artifact}" status --json
          "${artifact}" self-test --json
          python3 scripts/runtime_mcp_smoke.py --artifact "${artifact}" --json

          target="${RUNNER_TEMP}/agent-skills-release-target"
          mkdir -p "${target}"
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          python3 scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          mkdir -p release-assets
          cp "${artifact}" "release-assets/agent-skills-mcp-v${RELEASE_VERSION}-linux"

      - name: Upload Linux binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-linux
          path: release-assets/agent-skills-mcp-v*-linux
          if-no-files-found: error
          compression-level: 0

  runtime-windows:
    name: Release Runtime Windows
    needs: preflight
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and verify Windows single binary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/build_runtime.py --output-dir .runtime-dist --json
          $artifact = (Resolve-Path .\.runtime-dist\agent-skills-mcp.exe).Path
          & $artifact status --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime status 失败" }
          & $artifact self-test --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime self-test 失败" }
          python scripts/runtime_mcp_smoke.py --artifact $artifact --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime MCP smoke 失败" }

          $target = Join-Path $env:RUNNER_TEMP "agent-skills-release-target"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目安装失败" }
          $installedRuntime = Join-Path $target ".agents\runtime\agent-skills-mcp.exe"
          python scripts/runtime_mcp_smoke.py --artifact $installedRuntime --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime MCP smoke 失败" }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $artifact "release-assets\agent-skills-mcp-v$env:RELEASE_VERSION-windows.exe"

      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-windows
          path: release-assets/agent-skills-mcp-v*-windows.exe
          if-no-files-found: error
          compression-level: 0

  runtime-macos:
    name: Release Runtime macOS
    needs: preflight
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Runtime build dependencies
        run: |
          python3 -m venv .venv-runtime
          .venv-runtime/bin/python -m pip install -r runtime/requirements-build.txt
          echo "${GITHUB_WORKSPACE}/.venv-runtime/bin" >> "${GITHUB_PATH}"

      - name: Build and verify macOS single binary
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build_runtime.py --output-dir .runtime-dist --json
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          "${artifact}" status --json
          "${artifact}" self-test --json
          python3 scripts/runtime_mcp_smoke.py --artifact "${artifact}" --json

          target="${RUNNER_TEMP}/agent-skills-release-target"
          mkdir -p "${target}"
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          python3 scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          mkdir -p release-assets
          cp "${artifact}" "release-assets/agent-skills-mcp-v${RELEASE_VERSION}-macos"

      - name: Upload macOS binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-macos
          path: release-assets/agent-skills-mcp-v*-macos
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [preflight, runtime-linux, runtime-windows, runtime-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-runtime-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error

      - name: Include end-user guide
        run: cp USAGE.md release-assets/USAGE.md

      - name: Validate release identity and assets
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(tr -d '\r\n' < VERSION)" = "${RELEASE_VERSION}"
          expected=(
            "agent-skills-mcp-v${RELEASE_VERSION}-linux"
            "agent-skills-mcp-v${RELEASE_VERSION}-windows.exe"
            "agent-skills-mcp-v${RELEASE_VERSION}-macos"
            "USAGE.md"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/${asset}" || { echo "missing release asset: ${asset}" >&2; exit 1; }
          done
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "tag 已存在，拒绝覆盖：${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release 已存在，拒绝覆盖：${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          cat SHA256SUMS

      - name: Create immutable GitHub Release
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "Agent_Skills ${RELEASE_TAG}" \
            --notes-file USAGE.md
          git fetch --tags
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${GITHUB_SHA}"
          published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          for asset in \
            "agent-skills-mcp-v${RELEASE_TAG#v}-linux" \
            "agent-skills-mcp-v${RELEASE_TAG#v}-windows.exe" \
            "agent-skills-mcp-v${RELEASE_TAG#v}-macos" \
            "USAGE.md" \
            "SHA256SUMS"; do
            grep -Fxq "${asset}" <<< "${published_assets}" || {
              echo "Release 缺少已发布资产：${asset}" >&2
              exit 1
            }
          done
          gh release view "${RELEASE_TAG}" --json tagName,targetCommitish,isDraft,isPrerelease,url,assets
