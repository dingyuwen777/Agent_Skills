name: Temporary Sync Runtime Package Gitignore

on:
  pull_request:
    paths:
      - .github/workflows/temporary-sync-runtime-package-gitignore.yml

permissions:
  contents: write

jobs:
  sync-contract:
    name: Sync Runtime Package gitignore contract
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Patch package assertions and permanent regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/runtime-package-tests.yml")
          text = workflow.read_text(encoding="utf-8")

          old = '          grep -Fq "/.agents/runtime/" "${target}/.gitignore"'
          new = (
              '          grep -Fq ".agents/project-context.json" "${target}/.gitignore"\n'
              '          ! grep -Fq "/.agents/runtime/" "${target}/.gitignore"'
          )
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 POSIX target runtime-ignore assertions, got {count}")
          text = text.replace(old, new)

          old = '          grep -Fq "对用户正常说明" "${no_args_target}/AGENTS.md"'
          new = (
              old
              + '\n          grep -Fq ".agents/project-context.json" "${no_args_target}/.gitignore"'
              + '\n          ! grep -Fq "/.agents/runtime/" "${no_args_target}/.gitignore"'
          )
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 POSIX no-args AGENTS assertions, got {count}")
          text = text.replace(old, new)

          old = '          if (Test-Path $legacyManifest) { throw "Windows 新安装不应保留 agent-skills-install.json" }'
          new = old + '''\n          $gitignore = Join-Path $target ".gitignore"\n          if (-not (Select-String -Path $gitignore -Pattern ".agents/project-context.json" -SimpleMatch -Quiet)) { throw "Windows 项目安装缺少 cache ignore" }\n          if (Select-String -Path $gitignore -Pattern "/.agents/runtime/" -SimpleMatch -Quiet) { throw "Windows 项目安装不应自动新增 Runtime ignore" }'''
          if text.count(old) != 1:
              raise SystemExit("Windows explicit-install anchor mismatch")
          text = text.replace(old, new, 1)

          old = '          if (Test-Path (Join-Path $noArgsTarget ".agents\\agent-skills-install.json")) { throw "Windows 无参数安装不应生成 install manifest" }'
          new = old + '''\n          $noArgsGitignore = Join-Path $noArgsTarget ".gitignore"\n          if (-not (Select-String -Path $noArgsGitignore -Pattern ".agents/project-context.json" -SimpleMatch -Quiet)) { throw "Windows 无参数安装缺少 cache ignore" }\n          if (Select-String -Path $noArgsGitignore -Pattern "/.agents/runtime/" -SimpleMatch -Quiet) { throw "Windows 无参数安装不应自动新增 Runtime ignore" }'''
          if text.count(old) != 1:
              raise SystemExit("Windows no-args anchor mismatch")
          text = text.replace(old, new, 1)
          workflow.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path(".agents/skills/coding/tests/test_runtime_gitignore_install_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          anchor = 'INSTALLER_SOURCE = ROOT / "runtime/agent_skills_runtime/project_installer.py"\n'
          replacement = anchor + 'RUNTIME_PACKAGE_WORKFLOW = ROOT / ".github/workflows/runtime-package-tests.yml"\n'
          if test_text.count(anchor) != 1:
              raise SystemExit("test constant anchor mismatch")
          test_text = test_text.replace(anchor, replacement, 1)

          anchor = '''    def test_canonical_install_contract_does_not_require_runtime_ignore(self) -> None:\n        """Bootstrap/Runtime canonical Owner 与维护说明必须明确不自动写 Runtime ignore。"""'''
          method = '''    def test_runtime_package_workflow_enforces_new_gitignore_contract(self) -> None:\n        """三平台 package 验收必须证明 cache ignore 存在且 Runtime ignore 不会被新安装写入。"""\n        workflow = RUNTIME_PACKAGE_WORKFLOW.read_text(encoding="utf-8")\n        self.assertGreaterEqual(\n            workflow.count('! grep -Fq "/.agents/runtime/" "${target}/.gitignore"'),\n            2,\n        )\n        self.assertGreaterEqual(\n            workflow.count('! grep -Fq "/.agents/runtime/" "${no_args_target}/.gitignore"'),\n            2,\n        )\n        self.assertIn("Windows 项目安装不应自动新增 Runtime ignore", workflow)\n        self.assertIn("Windows 无参数安装不应自动新增 Runtime ignore", workflow)\n        self.assertGreaterEqual(workflow.count(".agents/project-context.json"), 4)\n\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit("test method anchor mismatch")
          test_text = test_text.replace(anchor, method + anchor, 1)
          test_path.write_text(test_text, encoding="utf-8", newline="\n")
          PY

      - name: Commit and push synchronized CI contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yuwen.ding"
          git config user.email "dingyuwen777@gmail.com"
          git add .github/workflows/runtime-package-tests.yml .agents/skills/coding/tests/test_runtime_gitignore_install_contract.py
          git commit -m "同步 Runtime Package gitignore 验收"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
