name: Temporary Issue Acceptance Contract Migration

on:
  push:
    branches:
      - chg/issue-acceptance-closure-contract

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: chg/issue-acceptance-closure-contract
          fetch-depth: 0

      - name: Apply deterministic governance migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          def replace_field(text: str, field_id: str, new_block: str, label: str) -> str:
              marker = f'  - type: textarea\n    id: {field_id}\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{label}: missing field {field_id}')
              next_start = text.find('\n  - type:', start + len(marker))
              end = len(text) if next_start < 0 else next_start
              return text[:start] + new_block.rstrip() + '\n' + text[end:]

          # Canonical Requirement / Issue / PR governance.
          path = '.agents/skills/coding/references/17_需求来源与PR追溯治理.md'
          text = read(path)
          old = '''Issue 是需求索引，不复制大段 Spec/OpenAPI/Schema/Figma；已有正式事实引用唯一 Owner，避免形成第二份漂移正文。\n\n### Issue 类型与最少充分内容契约'''
          new = '''Issue 是需求索引，不复制大段 Spec/OpenAPI/Schema/Figma；已有正式事实引用唯一 Owner，避免形成第二份漂移正文。\n\n### Issue Title Contract\n\nIssue 标题是需求索引的一部分，应让协作者在列表中快速识别“事项类型 + 简洁主题”，但不能把状态、优先级、Owner、分支或实现进度塞进标题制造第二套元数据。项目已有更强 Issue 标题规范时优先遵守项目 Owner；没有更强规范时，GitHub profile 的默认格式为：\n\n```text\n[需求] <简洁目标>\n[缺陷] <可观察问题>\n[技术变更] <工程目标>\n```\n\n- `[需求]` 描述要获得的用户/调用方/系统可观察结果，不用 `feat:`、`feature:` 或实现文件名替代目标；\n- `[缺陷]` 描述当前可观察的错误现象或偏差，不把未经验证的根因写进标题；\n- `[技术变更]` 描述工程目标或目标状态，例如治理、架构、CI、依赖、安全、性能、基础设施改进；\n- **标题不承载状态、优先级、Owner、分支名或重复 Issue 编号**；这些属于平台字段、标签或正文；\n- 同一 Requirement 身份持续存在时，不因为实现方案、PR 拆分或状态变化随意改标题；实质需求身份变化应按项目治理决定更新还是建立新的正式 Owner。\n\nAgent_Skills 自身 GitHub Issue Form 的 chooser 名称固定为 `需求` / `缺陷` / `技术变更`，title prefix 固定为 `[需求] ` / `[缺陷] ` / `[技术变更] `。其他项目若已有正式 title convention 则不自动覆盖；非 GitHub 平台使用项目自己的等价“类型 + 简洁主题”表达。\n\n### Issue Acceptance Contract：公共 Contract + 类型 Profile + 平台 Profile\n\n统一的是 Requirement Source 的验收与关闭语义，而不是让所有 Issue 类型、Git 托管平台或工单系统使用完全相同的字面模板。**Acceptance Criteria 是 Requirement Source 的最终完成状态 Owner**；Change 只保存施工 Traceability / Evidence Ledger，PR/MR 只保存交付关系，任何下游载体都不能静默创建另一套成功标准。\n\n公共 Contract：\n\n- Acceptance Criteria 使用稳定 `AC1 / AC2 / ...` 标识；只要同一 Requirement 身份仍然存在，就保持原 AC 标识，不因为实现文件、PR 拆分或测试变化重新编号；实质范围变化应先更新正式 Requirement Owner，再同步下游 Traceability；\n- **Change 不创建第二套需求**。持久 Change 的 Requirement Traceability 必须直接指向上游 AC（例如 `#218 / AC3` 或目标项目等价稳定标识）并记录 direct Evidence；Change 自己的 `R1/R2/...` 若作为施工表格行存在，也必须明确映射回上游 AC，不能成为新的完成定义；\n- 单条 AC 的关闭处置使用 `satisfied / not_applicable / deferred / unresolved`：`satisfied` 需要直接 Evidence；`not_applicable` 需要基于当前范围的明确证据与原因；`deferred` 只有在建立**新的正式 Owner**（新 Issue/工单/Spec 单元等）并写明稳定引用后，才表示当前 Requirement 对该项的处置已经完成；其余情况为 `unresolved`；\n- `partial` / `unverified` 是证据不足状态，归入 `unresolved`，不能通过改名、CI Green 或 Change checklist 变成已完成；\n- 每个 `satisfied` AC 的 Evidence 必须能说明实际证明了什么对象、行为、条件和 revision/environment；测试存在、测试名称或 CI Green 本身不能替代 Requirement Coverage；\n- 公共字段至少包括 Acceptance Criteria、验证要求与上游事实源；需求 / Bug / 技术变更等类型 Profile 继续保留各自真正需要的使用场景、复现证据、兼容迁移、回滚等专项字段。\n\n平台 Profile：GitHub 可用 task list 表达 AC 状态；GitLab、Gitea、Azure DevOps、Jira 或其他系统使用项目真实的**等价 Acceptance/Closure 状态**。目标项目已有更强 Issue/工单模板或正式需求系统时继续优先遵守该 Owner，**不强制复制 Agent_Skills 的 GitHub Issue Form**。\n\n### Issue 类型与最少充分内容契约'''
          text = replace_once(text, old, new, 'insert title and acceptance contract')
          text = replace_once(
              text,
              '回归范围\n修复验收标准\n上游事实源 / 定义期望行为的资料',
              '回归范围\n验收标准\n验证要求\n上游事实源 / 定义期望行为的资料',
              'bug canonical fields',
          )
          text = replace_once(
              text,
              '验收标准\n验证计划\n上游事实源 / RFC / ADR / Contract / Schema / 指标或事故证据',
              '验收标准\n验证要求\n上游事实源 / RFC / ADR / Contract / Schema / 指标或事故证据',
              'technical canonical fields',
          )
          old = '''采用 GitHub 的项目可以通过 `.github/ISSUE_TEMPLATE/*.yml` 把上述关键字段实现为 Issue Form，并把需要显式处理的字段设为 required。目标项目是否安装、修改或关闭 blank issue，由目标项目当前治理决定：'''
          new = '''采用 GitHub 的项目可以通过 `.github/ISSUE_TEMPLATE/*.yml` 把上述关键字段实现为 Issue Form，并把需要显式处理的字段设为 required。GitHub 的 Acceptance Criteria 默认使用可回写 task list，例如：\n\n```text\n- [ ] AC1：第一个可独立验收结果\n- [ ] AC2：第二个可独立验收结果\n```\n\n如果已有未关闭 Issue 没有稳定 AC 编号，但它仍作为当前 Requirement Source 且关闭前需要逐项验收，在不改变原需求语义的前提下按现有顺序补稳定 AC 标识；无法安全恢复语义或没有写权限时保持 `unresolved` 并阻止关闭，不做历史 Issue 的批量猜测性迁移。目标项目是否安装、修改或关闭 blank issue，由目标项目当前治理决定：'''
          text = replace_once(text, old, new, 'github acceptance profile')
          old = '''- 一个 Issue 拆成多个 PR 时，每个 PR 都可以写同一个 `Requirement-Source`；\n- 只有当前 PR 的 merge 确实满足整个 Issue 的完成定义时才使用 `Closes #218`、`Fixes #218` 或 `Resolves #218`；'''
          new = '''- 一个 Issue 拆成多个 PR 时，每个 PR 都可以写同一个 `Requirement-Source`；\n- Requirement Source **需要 post-merge evidence**（例如目标分支 fresh CI、迁移/部署后验证、Change archive 或其他只能在 merge 后取得的证据）时，merge 前不得使用 `Closes` / `Fixes` / `Resolves`；只保留 `Requirement-Source`，由 Post-Merge Finalization 完成 Closure Audit、Acceptance 状态回写与重读后再关闭；\n- 只有不依赖 post-merge evidence，且当前 PR 的 merge 已经按项目规则足以满足整个 Issue 完成定义时，才可以使用 `Closes #218`、`Fixes #218` 或 `Resolves #218`；'''
          text = replace_once(text, old, new, 'closing keyword timing')

          start = text.index('## 9. Requirement Source 关闭前 Closure Audit')
          end = text.index('\n## 10. 多人协作中的实际边界', start)
          section = '''## 9. Requirement Source 关闭前 Closure Audit\n\nAgent 关闭 Issue/工单 Requirement Source 为 `completed` / `resolved` 前，先取得项目要求的 post-merge evidence。Acceptance Criteria 仍由 Requirement Source 自己拥有，Closure Audit 必须把 Evidence 反向同步到该正式 Owner，而不是只在 Change/PR/最终回复里声明完成。\n\nGitHub Issue 的标准顺序是：\n\n```text\n重新读取当前 Requirement Source\n→ 逐条 Requirement → Evidence 审计\n→ 将每个 AC 映射为 satisfied / not_applicable / deferred / unresolved\n→ 仅把已正式处置项从 `- [ ]` → `- [x]`，并保留 N/A / deferred 依据\n→ 写回 Issue body\n→ 重新读取 Issue\n→ 确认 AC 文本、状态与 Evidence 映射没有写入漂移，且不存在仍适用的未勾选项\n→ 执行 close\n→ 再次读取 Issue\n→ 确认真实状态为 closed/completed，且已写回的 Acceptance 状态仍然存在\n```\n\n状态映射：\n\n- `satisfied`：至少关联一项**直接 Evidence**，并说明该 Evidence 实际证明的**可观察结果**；至少核对是否对应同一**对象、行为、条件**、`revision/commit` 和必要环境。GitHub task list 可更新为 `[x]`；\n- `not_applicable`：只有当前范围事实明确证明该 AC 不适用时才能使用，并在 AC 或 Closure Audit 记录原因；GitHub 可把该 AC 标成 `[x]`，但必须保留 `N/A` 依据，不能把“没做”冒充不适用；\n- `deferred`：必须已经建立新的正式 Owner 并写明稳定引用，例如 `Deferred → #245`；只有这样当前 Requirement 对该 AC 的处置才可标 `[x]`。没有新 Owner 时仍是 `unresolved`；\n- `unresolved`：包含 `partial`、`unverified`、未满足或关键事实未知；GitHub 保持 `[ ]`。**仍适用的未勾选项不得关闭**整个 Requirement Source，也不能因为 CI Green、merge、Change archive 或作者声明而自动完成。\n\n证据边界：\n\n- 直接 Evidence **不等于必须自动化测试**；按验收对象选择 Unit、Integration、Workflow/Acceptance、真实运行结果、Contract 验证、截图/视觉审查或人工语义审计等足够且匹配的证据；\n- 测试名称、测试文件或 `CI Green` 本身不是 Requirement Coverage 证明；只有实际 Evidence 支持的 AC 才能更新完成状态；\n- Closure Audit 可以用单独 comment / work-item history 保存详细 AC→Evidence 映射，让 Requirement body 保持清晰；但 GitHub body 中的 task-list 完成状态仍必须真实写回，不能只写 comment 后直接 close；\n- 写回后必须重新读取。写入失败、正文被并发修改、AC 数量/文本漂移或仍存在适用的 `[ ]` 时停止，不得关闭；\n- close 后必须再次读取真实状态；API 返回成功但后续读取不是 `closed/completed` 时只能报告 `blocked/incomplete`；\n- **无写权限**/写失败则报告未同步，不得声称完成；\n- **关闭关键字不得绕过** Closure Audit；需 post-merge evidence 时合并前禁用 `Closes` / `Fixes` / `Resolves`；\n- 非 GitHub 平台按目标项目的等价字段 / 状态执行同一“逐项 Evidence → 状态回写 → 重读确认 → close → 再读”语义；没有 close 生命周期时至少回写/重读可用的 Acceptance 状态，不发明平台能力。\n'''
          text = text[:start] + section.rstrip() + text[end:]
          write(path, text)

          # Post-merge finalization only orchestrates the canonical Closure owner.
          path = '.agents/skills/coding/references/23_端到端交付与合并后收尾.md'
          text = read(path)
          old = '''确认真实 merge commit / 目标分支 HEAD\n→ main fresh CI\n→ Change archive（适用时）\n→ 重新读取 Requirement Source 并执行 Closure Audit\n→ 关闭 Requirement Source 为 completed / resolved（适用、直接 Evidence 满足且有写权限时）\n→ 分支清理：清理本仓当前任务已合并且确认不再需要的任务分支 / worktree\n→ 最终交付报告'''
          new = '''确认真实 merge commit / 目标分支 HEAD\n→ main fresh CI\n→ Change archive（适用时）\n→ 重新读取 Requirement Source 并执行 Closure Audit\n→ Acceptance checklist 同步（GitHub）/ 等价 Acceptance 状态同步（其他平台）\n→ 写后重新读取 Requirement Source\n→ 关闭 Requirement Source 为 completed / resolved（适用、直接 Evidence 满足且有写权限时）\n→ close 后再次读取 Requirement Source\n→ 分支清理：清理本仓当前任务已合并且确认不再需要的任务分支 / worktree\n→ 最终交付报告'''
          text = replace_once(text, old, new, 'post-merge sequence')
          old = '''- Requirement Source 的逐项证据和 close 语义继续由需求追溯 Owner 的 Closure Audit 决定；需要 post-merge evidence 时不得用 `Closes` / `Fixes` / `Resolves` 提前绕过；'''
          new = '''- Requirement Source 的逐项证据和 close 语义继续由需求追溯 Owner 的 Closure Audit 决定；Finalization 必须等 Acceptance 状态真实写回并重读确认后才允许 close，close 后还要再次读取确认最终状态；需要 post-merge evidence 时不得用 `Closes` / `Fixes` / `Resolves` 提前绕过；\n- 任一 required 的 Acceptance checklist / 等价状态同步、写后重读、close 或 close 后重读失败时，流程状态必须是 `blocked/incomplete`，不得继续用 cleanup 或最终报告掩盖 Closure 缺口；'''
          text = replace_once(text, old, new, 'post-merge closure hard rule')
          old = '''+ Closure Audit 已完成\n+ Requirement Source 已关闭或有事实依据的 not_applicable\n+ 当前任务分支清理已完成或有事实依据的 not_applicable'''
          new = '''+ Closure Audit 已完成\n+ Acceptance 状态已同步并完成写后重读确认，或有事实依据的 not_applicable\n+ Requirement Source 已关闭且完成 close 后重读确认，或有事实依据的 not_applicable\n+ 当前任务分支清理已完成或有事实依据的 not_applicable'''
          text = replace_once(text, old, new, 'completion criteria')
          write(path, text)

          # GitHub Issue Form profiles: exact chooser/title contract + shared acceptance/validation semantics.
          form_titles = {
              '01-requirement.yml': ('name: 需求 / 功能', 'name: 需求'),
              '02-bug.yml': ('name: 缺陷 / Bug', 'name: 缺陷'),
              '03-technical-change.yml': ('name: 技术变更 / 工程改进', 'name: 技术变更'),
          }
          acceptance_blocks = {
              '01-requirement.yml': '''  - type: textarea\n    id: acceptance_criteria\n    attributes:\n      label: 验收标准\n      description: 每条使用稳定 AC1/AC2/... 编号，并写成可观察、可验证的完成条件；该 task list 是关闭 Issue 时需要逐项回写的最终 Acceptance 状态。\n      placeholder: |\n        - [ ] AC1：当……时，应……\n        - [ ] AC2：……保持不变\n        - [ ] AC3：对应测试 / 验证可以证明……\n    validations:\n      required: true''',
              '02-bug.yml': '''  - type: textarea\n    id: acceptance_criteria\n    attributes:\n      label: 验收标准\n      description: 每条使用稳定 AC1/AC2/... 编号，定义缺陷修复和相邻回归的可观察完成条件；关闭 Issue 前按直接 Evidence 逐项回写。\n      placeholder: |\n        - [ ] AC1：原复现路径不再失败\n        - [ ] AC2：新增 / 补齐回归测试或等价直接 Evidence\n        - [ ] AC3：相邻关键路径验证通过\n    validations:\n      required: true''',
              '03-technical-change.yml': '''  - type: textarea\n    id: acceptance_criteria\n    attributes:\n      label: 验收标准\n      description: 每条使用稳定 AC1/AC2/... 编号，用可观察、可验证条件定义技术变更完成；关闭 Issue 前按直接 Evidence 逐项回写。\n      placeholder: |\n        - [ ] AC1：……行为保持兼容\n        - [ ] AC2：……指标达到……\n        - [ ] AC3：……旧路径安全移除 / 保留\n    validations:\n      required: true''',
          }
          for filename, block in acceptance_blocks.items():
              p = f'.github/ISSUE_TEMPLATE/{filename}'
              value = read(p)
              old_name, new_name = form_titles[filename]
              value = replace_once(value, old_name, new_name, f'{filename} chooser name')
              value = replace_field(value, 'acceptance_criteria', block, filename)
              if filename == '02-bug.yml':
                  upstream = '  - type: textarea\n    id: upstream_sources\n'
                  index = value.find(upstream)
                  if index < 0:
                      raise SystemExit('bug: upstream_sources marker missing')
                  validation = '''  - type: textarea\n    id: validation_requirements\n    attributes:\n      label: 验证要求\n      description: 需要哪些自动回归、Workflow / 真实调用路径、环境复验或其他直接 Evidence 才能证明 AC 完成？\n      placeholder: |\n        - 自动回归：……\n        - Workflow / 真实路径：……\n        - 其他证据：……\n    validations:\n      required: true\n\n'''
                  value = value[:index] + validation + value[index:]
              elif filename == '03-technical-change.yml':
                  validation = '''  - type: textarea\n    id: validation_requirements\n    attributes:\n      label: 验证要求\n      description: 需要哪些单元 / 集成 / E2E、基准、迁移演练、安全检查、部署验证或人工验收才能直接证明 AC？\n      placeholder: |\n        - 单元 / 集成：……\n        - 性能 / 安全：……\n        - 迁移 / 回滚演练：……\n        - 部署后验证：……\n    validations:\n      required: true'''
                  value = replace_field(value, 'validation_plan', validation, filename)
              write(p, value)

          # PR template: post-merge evidence cannot be auto-closed at merge time.
          path = '.github/PULL_REQUEST_TEMPLATE.md'
          text = read(path)
          old = '''- `Closes` / `Fixes` / `Resolves` 只在本 PR 合并后确实完成整个 Issue 时使用；不要用关闭关键字替代 `Requirement-Source:`。'''
          new = '''- `Closes` / `Fixes` / `Resolves` 只在本 PR 合并后确实完成整个 Issue 时使用；不要用关闭关键字替代 `Requirement-Source:`。\n- Requirement Source **需要 post-merge evidence**（例如 main fresh CI、迁移/部署后验证或 Change archive）时，merge 前**不得使用 `Closes` / `Fixes` / `Resolves`**；只保留 `Requirement-Source:`，由 Post-Merge Finalization 完成 Closure Audit、Acceptance 状态写回与重读确认后再关闭。'''
          text = replace_once(text, old, new, 'PR template closure timing')
          write(path, text)

          # Existing permanent regressions are updated to share the same contract.
          path = '.agents/skills/coding/tests/test_issue_forms_contract.py'
          text = read(path)
          text = replace_once(text, '            "validation_plan",', '            "validation_requirements",', 'technical form test field')
          old = '''            "模板完整不等于需求已经完整",\n        ]'''
          new = '''            "模板完整不等于需求已经完整",\n            "AC1 / AC2 / ...",\n            "公共 Contract + 类型 Profile + 平台 Profile",\n            "Issue Title Contract",\n        ]'''
          text = replace_once(text, old, new, 'issue canonical regression markers')
          write(path, text)

          path = '.agents/skills/coding/tests/test_pr_requirement_traceability.py'
          text = read(path)
          old = '''            "关闭关键字不得绕过",\n            "非 GitHub 平台",'''
          new = '''            "关闭关键字不得绕过",\n            "`- [ ]` → `- [x]`",\n            "写回 Issue body",\n            "再次读取 Issue",\n            "仍适用的未勾选项",\n            "非 GitHub 平台",'''
          text = replace_once(text, old, new, 'closure traceability regression markers')
          write(path, text)

          path = '.agents/skills/coding/tests/test_pr_requirement_source.py'
          text = read(path)
          old = '''        self.assertIn("不要用关闭关键字替代", template)'''
          new = '''        self.assertIn("不要用关闭关键字替代", template)\n        self.assertIn("需要 post-merge evidence", template)\n        self.assertIn("不得使用 `Closes` / `Fixes` / `Resolves`", template)\n        self.assertIn("Closure Audit", template)'''
          text = replace_once(text, old, new, 'PR template regression markers')
          write(path, text)

