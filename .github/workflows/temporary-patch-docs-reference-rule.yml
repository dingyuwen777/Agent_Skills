name: Temporary Patch Docs Reference Rule

on:
  push:
    branches:
      - feat/docs-reference-link-rule
    paths:
      - '.github/scripts/temporary_patch_docs_reference_rule.py'
      - '.github/workflows/temporary-patch-docs-reference-rule.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/docs-reference-link-rule

      - name: Apply deterministic Docs rule patch
        run: python .github/scripts/temporary_patch_docs_reference_rule.py

      - name: Verify target preservation test
        run: python -m unittest .agents/skills/coding/tests/test_docs_skill.py -v

      - name: Validate diff
        run: git diff --check

      - name: Commit production rule changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/docs/SKILL.md .agents/skills/docs/references/02_第一性原理技术写作.md .agents/skills/docs/references/03_审查编写与修复流程.md
          git diff --cached --quiet && exit 0
          git commit -m '固化文档引用路径与可点击链接规范'
          git push origin HEAD:feat/docs-reference-link-rule
