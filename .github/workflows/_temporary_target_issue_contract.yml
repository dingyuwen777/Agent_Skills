name: Temporary Target Issue Contract

on:
  push:
    branches:
      - chg/issue-acceptance-closure-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: chg/issue-acceptance-closure-contract
          fetch-depth: 0
      - name: Apply target-repository default Issue Contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reference = Path('.agents/skills/coding/references/17_需求来源与PR追溯治理.md')
          text = reference.read_text(encoding='utf-8')
          anchor = '平台 Profile：GitHub 可用 task list 表达 AC 状态；GitLab、Gitea、Azure DevOps、Jira 或其他系统使用项目真实的**等价 Acceptance/Closure 状态**。目标项目已有更强 Issue/工单模板或正式需求系统时继续优先遵守该 Owner，**不强制复制 Agent_Skills 的 GitHub Issue Form**。'
          insert = '''平台 Profile：GitHub 可用 task list 表达 AC 状态；GitLab、Gitea、Azure DevOps、Jira 或其他系统使用项目真实的**等价 Acceptance/Closure 状态**。目标项目已有更强 Issue/工单模板或正式需求系统时继续优先遵守该 Owner，**不强制复制 Agent_Skills 的 GitHub Issue Form**。\n\n#### UI Profile 与 Agent 行为解耦\n\n**GitHub Form 只是可选 UI Profile**，不是本 Contract 生效的前提。任何进入 Agent_Skills 治理的目标仓库，在创建、规范、更新和关闭 Requirement Source 时都先恢复项目自己的 Issue/Ticket/Title/Closure 规则；项目已有更强规则就遵守项目 Owner，项目没有更强规则时**仍执行本节默认 Contract**。\n\n- 目标仓库**没有安装或复制 Agent_Skills GitHub Forms**，不能被解释为标题、稳定 AC、Evidence Sufficiency 或 Closure Audit `not_applicable`；Agent 仍按默认“类型 + 简洁主题”、稳定 `AC1/AC2/...`、充分 Evidence、状态回写、重读、close、再读执行；\n- 目标仓库有自己的 Issue Form / Ticket schema 时，先映射项目已有字段；公共语义缺口可在当前 Requirement Source 中补足，但不得为了格式统一删除项目专项字段或建立第二份需求；\n- 需要把默认 Profile 固化成目标仓库 `.github/ISSUE_TEMPLATE`、PR Template、Jira workflow 或其他平台配置时，这是独立的项目治理写入，必须有项目写授权并遵守目标仓库 Change/Review/CI；**落地 Issue Form 不是 Agent 行为 Contract 生效的前置条件**；\n- 同一端到端任务实际修改多个仓库时，每个仓库继续使用自己的 Requirement/Change/PR 生命周期；canonical Contract 可以共享，跨仓实现和 Evidence 不合并进一个 Change。'''
          if text.count(anchor) != 1:
              raise SystemExit(f'reference anchor count={text.count(anchor)}')
          reference.write_text(text.replace(anchor, insert, 1), encoding='utf-8')

          test_path = Path('.agents/skills/coding/tests/test_issue_acceptance_closure_contract.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def test_contract_is_cross_platform_without_forcing_github_forms(self) -> None:\n'
          new_test = '''    def test_target_repository_default_contract_does_not_require_installed_github_forms(self) -> None:\n        \"\"\"目标仓库未复制 GitHub Form 时，Agent 默认 Issue lifecycle 仍必须生效。\"\"\"\n        text = self._read(TRACEABILITY)\n        required = (\n            \"GitHub Form 只是可选 UI Profile\",\n            \"没有安装或复制 Agent_Skills GitHub Forms\",\n            \"创建、规范、更新和关闭 Requirement Source\",\n            \"仍执行本节默认 Contract\",\n            \"落地 Issue Form 不是 Agent 行为 Contract 生效的前置条件\",\n            \"每个仓库继续使用自己的 Requirement/Change/PR 生命周期\",\n        )\n        for item in required:\n            self.assertIn(item, text, item)\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'test marker count={tests.count(marker)}')
          test_path.write_text(tests.replace(marker, new_test + marker, 1), encoding='utf-8')
          PY
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_issue_acceptance_closure_contract.py' -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills/coding/references/17_需求来源与PR追溯治理.md .agents/skills/coding/tests/test_issue_acceptance_closure_contract.py
          git commit -m '明确目标仓库默认 Issue 治理 Contract'
          git push origin HEAD:chg/issue-acceptance-closure-contract
