name: Temporary Release Immutability Preflight Fix

on:
  push:
    branches:
      - fix/release-immutability-preflight-auth
    paths:
      - .github/workflows/tmp-fix-release-immutability-preflight.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-immutability-preflight-auth
          persist-credentials: true

      - name: Fix workflow indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/release.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          start = next(
              (i for i, line in enumerate(lines) if line == 'settings_token_source="GITHUB_TOKEN"\n'),
              None,
          )
          if start is None:
              raise SystemExit("unindented Release shell block start not found")
          end = next(
              (i for i in range(start, len(lines)) if lines[i] == "esac\n"),
              None,
          )
          if end is None:
              raise SystemExit("unindented Release shell block end not found")
          for index in range(start, end + 1):
              lines[index] = "          " + lines[index]
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify target regression
        run: >-
          python -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_runtime_release_hardening.py'
          -v

      - name: Commit verified workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git diff --cached --check
          git commit -m "修正 Release Workflow 预检块缩进"
          git push origin HEAD:fix/release-immutability-preflight-auth
