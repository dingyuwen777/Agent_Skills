name: Runtime Name Migration

on:
  push:
    branches:
      - chg/runtime-binary-agent-skills

permissions:
  contents: write

jobs:
  render-workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Render workflow replacements and create unattached blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import urllib.request

          root = Path.cwd()
          legacy = "agent-skills-" + "mcp"
          current = "agent-skills"

          package = root / ".github/workflows/runtime-package-tests.yml"
          package_text = package.read_text(encoding="utf-8").replace(legacy, current)
          package.write_text(package_text, encoding="utf-8", newline="\n")

          release = root / ".github/workflows/release.yml"
          text = release.read_text(encoding="utf-8").replace(legacy, current)

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"release replacement mismatch: {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)

          def regex_once(pattern: str, replacement: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"release regex mismatch: {pattern!r}: {count}")

          for old, new in (
              ('name="agent-skills-v${RELEASE_VERSION}-linux"', 'name="agent-skills"'),
              ('$name = "agent-skills-v$env:RELEASE_VERSION-windows"', '$name = "agent-skills"'),
              ('name="agent-skills-v${RELEASE_VERSION}-macos"', 'name="agent-skills"'),
              ('path: release-assets/agent-skills-v*-linux', 'path: release-assets/agent-skills'),
              ('path: release-assets/agent-skills-v*-windows.exe', 'path: release-assets/agent-skills.exe'),
              ('path: release-assets/agent-skills-v*-macos', 'path: release-assets/agent-skills'),
              ('          merge-multiple: true\n', ''),
          ):
              replace_once(old, new)

          regex_once(
              r'''          expected=\(\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-linux"\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-windows\.exe"\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-macos"\n\s+"USAGE\.md"\n\s+\)''',
              '''          expected=(\n            "release-runtime-linux/agent-skills"\n            "release-runtime-windows/agent-skills.exe"\n            "release-runtime-macos/agent-skills"\n            "USAGE.md"\n          )''',
          )
          regex_once(
              r'''          check_sha\(\) \{.*?          test -z "\$\(find release-assets -maxdepth 1 -name '\*\.manifest\.json' -print -quit\)"''',
              '''          check_sha() {\n            local binary_path="$1"\n            local expected_sha="$2"\n            local actual_sha\n            actual_sha="$(sha256sum "${binary_path}" | awk '{print $1}')"\n            test "${actual_sha}" = "${expected_sha}" || {\n              echo "Release artifact SHA256 不一致：${binary_path}" >&2\n              exit 1\n            }\n          }\n          check_sha "release-assets/release-runtime-linux/agent-skills" "${LINUX_ARTIFACT_SHA256}"\n          check_sha "release-assets/release-runtime-windows/agent-skills.exe" "${WINDOWS_ARTIFACT_SHA256}"\n          check_sha "release-assets/release-runtime-macos/agent-skills" "${MACOS_ARTIFACT_SHA256}"\n          test -z "$(find release-assets -name '*.manifest.json' -print -quit)"''',
          )
          regex_once(
              r'''          assets=\(\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-linux"\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-windows\.exe"\n\s+"agent-skills-v\$\{RELEASE_VERSION\}-macos"\n\s+"USAGE\.md"\n\s+\)''',
              '''          assets=(\n            "release-runtime-linux/agent-skills"\n            "release-runtime-windows/agent-skills.exe"\n            "release-runtime-macos/agent-skills"\n            "USAGE.md"\n          )''',
          )
          regex_once(
              r'''          packages = \[\n\s+\("linux", f"agent-skills-v\{version\}-linux\.zip", f"agent-skills-v\{version\}-linux"\),\n\s+\("windows", f"agent-skills-v\{version\}-windows\.zip", f"agent-skills-v\{version\}-windows\.exe"\),\n\s+\("macos", f"agent-skills-v\{version\}-macos\.zip", f"agent-skills-v\{version\}-macos"\),\n\s+\]\n\s+source = Path\("release-assets"\)\n\s+package_dir = Path\("release-package"\)\n\s+for platform, package_name, binary in packages:\n\s+expected = \[binary, "USAGE\.md"\]\n\s+package = package_dir / package_name\n\s+with zipfile\.ZipFile\(package, "w", compression=zipfile\.ZIP_DEFLATED, compresslevel=9\) as archive:\n\s+for name in expected:\n\s+archive\.write\(source / name, arcname=name\)\n\s+with zipfile\.ZipFile\(package\) as archive:\n\s+actual = archive\.namelist\(\)\n\s+if actual != expected:\n\s+raise SystemExit\(f"ZIP 成员集合不正确：\{platform\}: \{actual\}"\)''',
              '''          packages = [\n              ("linux", f"agent-skills-v{version}-linux.zip", Path("release-assets/release-runtime-linux/agent-skills"), "agent-skills"),\n              ("windows", f"agent-skills-v{version}-windows.zip", Path("release-assets/release-runtime-windows/agent-skills.exe"), "agent-skills.exe"),\n              ("macos", f"agent-skills-v{version}-macos.zip", Path("release-assets/release-runtime-macos/agent-skills"), "agent-skills"),\n          ]\n          usage = Path("release-assets/USAGE.md")\n          package_dir = Path("release-package")\n          for platform, package_name, binary_path, binary in packages:\n              expected = [binary, "USAGE.md"]\n              package = package_dir / package_name\n              with zipfile.ZipFile(package, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:\n                  archive.write(binary_path, arcname=binary)\n                  archive.write(usage, arcname="USAGE.md")\n              with zipfile.ZipFile(package) as archive:\n                  actual = archive.namelist()\n              if actual != expected:\n                  raise SystemExit(f"ZIP 成员集合不正确：{platform}: {actual}")''',
          )
          release.write_text(text, encoding="utf-8", newline="\n")
          if legacy in text or legacy in package_text:
              raise SystemExit("workflow migration left legacy binary name")

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          def create_blob(label: str, path: Path) -> None:
              payload = json.dumps({"content": path.read_text(encoding="utf-8"), "encoding": "utf-8"}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              print(f"{label}_BLOB_SHA={result['sha']}")
          create_blob("RELEASE", release)
          create_blob("PACKAGE", package)
          PY
