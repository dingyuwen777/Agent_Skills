name: Runtime Name Migration

on:
  push:
    branches:
      - chg/runtime-binary-agent-skills

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-name-migrated]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Apply deterministic migration
        run: python scripts/_apply_runtime_name_migration.py

      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "迁移脚本没有产生变更" >&2; exit 1; }
          git commit -m "[runtime-name-migrated] 运行时：统一 agent-skills 二进制命名"
          git push origin "HEAD:${GITHUB_REF_NAME}"
