name: Runtime Package Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  scope:
    name: Runtime Package Scope
    runs-on: ubuntu-24.04
    outputs:
      runtime_required: ${{ steps.detect.outputs.runtime_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Runtime package risk
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${GITHUB_SHA}"
          fi

          runtime_required=false
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            runtime_required=true
          else
            while IFS= read -r path; do
              case "${path}" in
                .gitattributes|runtime/*|runtime/**/*|scripts/build_runtime.py|scripts/runtime_mcp_smoke.py|.github/workflows/runtime-package-tests.yml|.github/workflows/release.yml)
                  runtime_required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi

          echo "runtime_required=${runtime_required}" >> "${GITHUB_OUTPUT}"
          if [[ "${runtime_required}" == "true" ]]; then
            echo "Runtime package risk detected; Linux/Windows/macOS package evidence is required."
          else
            echo "Runtime package surfaces are unchanged; three-platform package jobs are not applicable."
          fi

  runtime-linux-package:
    name: Runtime Linux Package
    needs: scope
    if: needs.scope.outputs.runtime_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and self-test Linux onefile Runtime
        run: |
          set -euo pipefail
          build_json="$(python scripts/build_runtime.py --output-dir .runtime-dist --json)"
          printf '%s\n' "${build_json}"
          BUILD_JSON="${build_json}" python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(os.environ["BUILD_JSON"])
          assert payload["release_version"] == "0.0.0-dev"
          assert payload["python_version"] == "3.14.7"
          assert re.fullmatch(r"[0-9a-f]{64}", payload["integrity_fingerprint"])
          artifact = Path(payload["artifact"])
          assert artifact.is_file()
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert digest == payload["artifact_sha256"]
          PY
          .runtime-dist/agent-skills-mcp status --json
          .runtime-dist/agent-skills-mcp self-test --json
          test ! -e .runtime-dist/agent-skills-mcp-runtime-kit.zip
          test -z "$(find .runtime-dist -maxdepth 1 -name '*.manifest.json' -print -quit)"

      - name: Verify real stdio MCP contract
        run: >-
          python scripts/runtime_mcp_smoke.py
          --artifact .runtime-dist/agent-skills-mcp
          --json

      - name: Verify project-only single-binary installation
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          target="${RUNNER_TEMP}/agent-skills-project-target"
          no_args_target="${RUNNER_TEMP}/agent-skills-project-no-args"
          mkdir -p "${target}" "${no_args_target}"

          "${artifact}" install --target "${target}" --json
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          test ! -e "${target}/.agents/agent-skills-install.json"
          test -f "${target}/.cursor/mcp.json"
          test -f "${target}/.mcp.json"
          test -f "${target}/.codex/config.toml"
          test -f "${target}/CLAUDE.md"
          test -f "${target}/.agents/skills/ENTRY.md"
          test -f "${target}/.agents/skills/router/SKILL.md"
          ! grep -Fq ".agents/skills/" "${target}/AGENTS.md"
          ! grep -Fq "ENTRY.md" "${target}/AGENTS.md"
          ! grep -Fq "router/SKILL.md" "${target}/AGENTS.md"
          ! grep -Fq "Reference" "${target}/AGENTS.md"
          grep -Fq "代码修改" "${target}/AGENTS.md"
          grep -Fq "测试" "${target}/AGENTS.md"
          grep -Fq "文档同步" "${target}/AGENTS.md"
          grep -Fq "用户可见" "${target}/AGENTS.md"
          grep -Fq ".agents/skills/router/SKILL.md" "${target}/.agents/skills/ENTRY.md"
          grep -Fq ".agents/skills/coding/SKILL.md" "${target}/.agents/skills/router/SKILL.md"
          grep -Fq "agent_skills_load_required_context" "${target}/.agents/skills/router/SKILL.md"
          test ! -e "${target}/.agents/skills/coding/references"
          grep -Fq "/.agents/runtime/" "${target}/.gitignore"
          test "$(grep -c '<!-- agent-skills:managed:start -->' "${target}/AGENTS.md")" -eq 1
          "${target}/.agents/runtime/agent-skills-mcp" status --json
          state_json="$("${target}/.agents/runtime/agent-skills-mcp" __install-state --json)"
          STATE_JSON="${state_json}" python - <<'PY'
          import json
          import os
          state = json.loads(os.environ["STATE_JSON"])
          assert state["schema"] == "agent-skills-runtime-install-state/v1"
          assert "ENTRY.md" in state["shared_files"]
          assert "router/SKILL.md" in state["managed_files"]
          PY
          python scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          cd "${no_args_target}"
          "${artifact}"
          test -x "${no_args_target}/.agents/runtime/agent-skills-mcp"
          test ! -e "${no_args_target}/.agents/agent-skills-install.json"
          test -f "${no_args_target}/.agents/skills/ENTRY.md"
          test -f "${no_args_target}/.agents/skills/router/SKILL.md"
          ! grep -Fq ".agents/skills/" "${no_args_target}/AGENTS.md"
          ! grep -Fq "ENTRY.md" "${no_args_target}/AGENTS.md"
          ! grep -Fq "router/SKILL.md" "${no_args_target}/AGENTS.md"
          grep -Fq "用户可见" "${no_args_target}/AGENTS.md"

  runtime-windows-package:
    name: Runtime Windows Package
    needs: scope
    if: needs.scope.outputs.runtime_required == 'true'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and self-test Windows onefile Runtime
        shell: pwsh
        run: |
          $buildJson = (python scripts/build_runtime.py --output-dir .runtime-dist --json | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime build 失败" }
          Write-Output $buildJson
          $build = $buildJson | ConvertFrom-Json
          if ($build.release_version -ne "0.0.0-dev") { throw "普通 CI Runtime 必须使用 development version" }
          if ($build.python_version -ne "3.14.7") { throw "Runtime Python 版本不是 3.14.7" }
          if ($build.integrity_fingerprint -notmatch '^[0-9a-f]{64}$') { throw "Runtime integrity fingerprint 非法" }
          $artifactHash = (Get-FileHash -Algorithm SHA256 $build.artifact).Hash.ToLowerInvariant()
          if ($artifactHash -ne $build.artifact_sha256) { throw "Runtime artifact SHA256 与 Builder 输出不一致" }
          .\.runtime-dist\agent-skills-mcp.exe status --json
          .\.runtime-dist\agent-skills-mcp.exe self-test --json
          if (Test-Path .\.runtime-dist\agent-skills-mcp-runtime-kit.zip) { throw "不应生成 Windows Runtime Kit" }
          if (Get-ChildItem .\.runtime-dist -Filter *.manifest.json -File) { throw "Builder 不应生成 manifest sidecar" }

      - name: Verify real stdio MCP contract
        shell: pwsh
        run: |
          python scripts/runtime_mcp_smoke.py --artifact .\.runtime-dist\agent-skills-mcp.exe --json
          if ($LASTEXITCODE -ne 0) { throw "Windows Runtime MCP smoke 失败" }

      - name: Verify project-only single-binary installation
        shell: pwsh
        run: |
          $artifact = (Resolve-Path .\.runtime-dist\agent-skills-mcp.exe).Path
          $target = Join-Path $env:RUNNER_TEMP "agent-skills-project-target"
          $noArgsTarget = Join-Path $env:RUNNER_TEMP "agent-skills-project-no-args"
          New-Item -ItemType Directory -Force -Path $target, $noArgsTarget | Out-Null

          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目首次安装失败" }
          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目重复升级失败" }

          $installedRuntime = Join-Path $target ".agents\runtime\agent-skills-mcp.exe"
          $legacyManifest = Join-Path $target ".agents\agent-skills-install.json"
          $entry = Join-Path $target ".agents\skills\ENTRY.md"
          $router = Join-Path $target ".agents\skills\router\SKILL.md"
          $agents = Join-Path $target "AGENTS.md"
          foreach ($path in @(
            $installedRuntime,
            $entry,
            $router,
            $agents,
            (Join-Path $target ".cursor\mcp.json"),
            (Join-Path $target ".mcp.json"),
            (Join-Path $target ".codex\config.toml"),
            (Join-Path $target "CLAUDE.md")
          )) {
            if (-not (Test-Path $path)) { throw "Windows 项目安装缺少文件: $path" }
          }
          if (Test-Path $legacyManifest) { throw "Windows 新安装不应保留 agent-skills-install.json" }
          foreach ($forbidden in @(".agents/skills/", "ENTRY.md", "router/SKILL.md", "Reference")) {
            if (Select-String -Path $agents -Pattern $forbidden -SimpleMatch -Quiet) {
              throw "Windows 目标 AGENTS 泄露 Runtime 内部治理结构: $forbidden"
            }
          }
          foreach ($required in @("代码修改", "测试", "文档同步", "用户可见")) {
            if (-not (Select-String -Path $agents -Pattern $required -SimpleMatch -Quiet)) {
              throw "Windows 目标 AGENTS 缺少工程过程语义: $required"
            }
          }
          if (-not (Select-String -Path $entry -Pattern ".agents/skills/router/SKILL.md" -SimpleMatch -Quiet)) { throw "Windows Entry 未指向 Router Skill" }
          if (-not (Select-String -Path $router -Pattern ".agents/skills/coding/SKILL.md" -SimpleMatch -Quiet)) { throw "Windows Router 未指向 Coding Skill" }
          if (-not (Select-String -Path $router -Pattern "agent_skills_load_required_context" -SimpleMatch -Quiet)) { throw "Windows Router 未保留 Runtime required Context 路由" }
          if (Test-Path (Join-Path $target ".agents\skills\coding\references")) { throw "Windows 目标项目不应安装 Reference 或 Stub" }
          & $installedRuntime status --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime status 失败" }
          $state = (& $installedRuntime __install-state --json | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime install-state 失败" }
          if ($state.schema -ne "agent-skills-runtime-install-state/v1") { throw "Windows Runtime install-state schema 非法" }
          if (@($state.shared_files) -notcontains "ENTRY.md") { throw "Windows Runtime install-state 未认领 ENTRY.md" }
          if (@($state.managed_files) -notcontains "router/SKILL.md") { throw "Windows Runtime install-state 未认领 Router" }
          python scripts/runtime_mcp_smoke.py --artifact $installedRuntime --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime MCP smoke 失败" }

          Push-Location $noArgsTarget
          try {
            & $artifact
            if ($LASTEXITCODE -ne 0) { throw "Windows binary 无参数项目安装失败" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\runtime\agent-skills-mcp.exe"))) { throw "Windows binary 无参数运行未安装项目 Runtime" }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\skills\ENTRY.md"))) { throw "Windows binary 无参数运行未安装 Entry" }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\skills\router\SKILL.md"))) { throw "Windows binary 无参数运行未安装 Router Skill" }
          if (Test-Path (Join-Path $noArgsTarget ".agents\agent-skills-install.json")) { throw "Windows 无参数安装不应生成 install manifest" }
          $noArgsAgents = Join-Path $noArgsTarget "AGENTS.md"
          foreach ($forbidden in @(".agents/skills/", "ENTRY.md", "router/SKILL.md")) {
            if (Select-String -Path $noArgsAgents -Pattern $forbidden -SimpleMatch -Quiet) { throw "Windows binary 无参数运行的 AGENTS 泄露内部治理结构: $forbidden" }
          }
          if (-not (Select-String -Path $noArgsAgents -Pattern "用户可见" -SimpleMatch -Quiet)) { throw "Windows binary 无参数运行的 AGENTS 缺少用户可见进度边界" }

  runtime-macos-package:
