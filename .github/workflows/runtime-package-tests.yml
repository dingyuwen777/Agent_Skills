  runtime-package-gate:
    name: Runtime Package Gate
    if: always()
    needs:
      - scope
      - runtime-linux-package
      - runtime-windows-package
      - runtime-macos-package
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required Runtime package evidence
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUNTIME_REQUIRED: ${{ needs.scope.outputs.runtime_required }}
          LINUX_RESULT: ${{ needs.runtime-linux-package.result }}
          WINDOWS_RESULT: ${{ needs.runtime-windows-package.result }}
          MACOS_RESULT: ${{ needs.runtime-macos-package.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = "success"
          case "${RUNTIME_REQUIRED}" in
            true)
              test "${LINUX_RESULT}" = "success"
              test "${WINDOWS_RESULT}" = "success"
              test "${MACOS_RESULT}" = "success"
              ;;
            false)
              test "${LINUX_RESULT}" = "skipped"
              test "${WINDOWS_RESULT}" = "skipped"
              test "${MACOS_RESULT}" = "skipped"
              ;;
            *)
              echo "Unknown runtime_required value: ${RUNTIME_REQUIRED}" >&2
              exit 1
              ;;
          esac
