name: Temporary Project Governance Bootstrap Patch

on:
  push:
    branches:
      - feat/project-governance-bootstrap
    paths:
      - .github/workflows/tmp-project-governance-bootstrap-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/project-governance-bootstrap
      - name: Apply deterministic governance rule patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill_path = ".agents/skills/coding/SKILL.md"
          skill_anchor = """Greenfield 仓库即使暂时为空，也先确认仓库根、当前 Git 状态、目标运行/交付环境和用户已确认约束；没有既有代码时不伪造“当前架构”，而是把尚待建立的工程事实标成待决策或待实现。\n\n### 4.3 恢复项目和工具链事实\n"""
          skill_insert = """Greenfield 仓库即使暂时为空，也先确认仓库根、当前 Git 状态、目标运行/交付环境和用户已确认约束；没有既有代码时不伪造“当前架构”，而是把尚待建立的工程事实标成待决策或待实现。\n\n#### 4.2.1 首次接入的 Project Governance Bootstrap\n\n当目标项目已经安装/可访问 Agent_Skills，且出现以下任一情况时，在**任何实质性生产代码修改之前**先完成 Project Governance Bootstrap：\n\n- 项目首次接入 Agent_Skills；\n- 根 `AGENTS.md` 不存在、仍标记 Project Governance Bootstrap“状态：待校准”，或已有项目规则从未按当前仓库事实做过首次校准；\n- 当前自然语言研发任务暴露技术栈、模块职责、Contract/Schema、开发验证入口、CI/Release/部署等长期治理事实可能已与 `AGENTS.md` 漂移；\n- 用户明确要求创建、刷新或校准项目规则。\n\n执行时必须读取 [01_项目发现与可失效缓存.md](references/01_项目发现与可失效缓存.md) 与 [12_目标项目安装与AGENTS_Bootstrap.md](references/12_目标项目安装与AGENTS_Bootstrap.md)。普通自然语言开发、修复或重构请求本身即可触发该前置流程，用户不需要记忆额外内部命令。Runtime binary 只负责机械安装；仓库语义调查由当前宿主大模型完成。\n\n如果当前任务已授权修改项目，则宿主大模型先做有界事实调查，只在 Agent Skills 自管区之外创建或校准项目自己的 `AGENTS.md` Overlay；完成后把项目自有治理状态标记为“状态：已校准”，**重新读取最终 `AGENTS.md`**，再回到同一任务**继续原始研发任务**。如果当前任务只有只读授权，则只能在会话内完成调查并报告治理未校准，不得写 `AGENTS.md`。\n\n首次校准不是每个任务都重跑的全仓审计。状态已校准且没有长期治理事实变化时，只做廉价漂移检查并直接进入本次任务；只有受影响的长期事实变化时才 targeted 更新对应 Overlay 内容。\n\n### 4.3 恢复项目和工具链事实\n"""
          replace_once(skill_path, skill_anchor, skill_insert)

          skill_route_anchor = """| 首次安装/升级 Agent_Skills、创建/补充目标项目 AGENTS 或修复 managed block | [12_目标项目安装与AGENTS_Bootstrap.md](references/12_目标项目安装与AGENTS_Bootstrap.md) |\n"""
          skill_route_new = """| 首次安装/升级 Agent_Skills、创建/补充目标项目 AGENTS、首次 Project Governance Bootstrap、治理事实漂移校准或修复 managed block | [01_项目发现与可失效缓存.md](references/01_项目发现与可失效缓存.md) + [12_目标项目安装与AGENTS_Bootstrap.md](references/12_目标项目安装与AGENTS_Bootstrap.md) |\n"""
          replace_once(skill_path, skill_route_anchor, skill_route_new)

          discovery_path = ".agents/skills/coding/references/01_项目发现与可失效缓存.md"
          discovery_anchor = """8. 如果仓库几乎为空或只有需求资料，明确进入 Greenfield：缺失项先作为“尚未建立”记录，不自动从个人经验补全框架、目录、数据库或 CI。\n\n## 持久索引\n"""
          discovery_insert = """8. 如果仓库几乎为空或只有需求资料，明确进入 Greenfield：缺失项先作为“尚未建立”记录，不自动从个人经验补全框架、目录、数据库或 CI。\n\n## Project Governance Bootstrap 的有界事实调查\n\n普通 discover 先回答“事实入口在哪里”；首次 Project Governance Bootstrap 还需要由当前宿主大模型对**长期研发治理相关内容**做一次有界事实调查。它不是全仓全文扫描，也不能只看文件名填模板。\n\n调查结果必须把准备写入或修正 `AGENTS.md` 的内容分成三类：\n\n1. **规范性规则**：项目 Owner、现有 `AGENTS.md` / `CONTRIBUTING`、正式需求/Spec/ADR、明确团队制度等在回答“项目应该怎样工作”的约束。当前代码、CI 或配置没有遵守规范时，应记录实现/配置偏离并按任务范围修复或报告；**不能因为当前实现没有遵守就删除或弱化规则**，更不能改 `AGENTS.md` 让错误实现合法化。多个规范性事实源互相冲突且会影响实质实现时，继续核实或提请 Owner 决策。\n2. **描述性事实**：当前语言/Runtime、真实 Manifest/lock、模块入口、已存在 Contract/Schema/Migration、构建/测试命令、CI/Release/部署方式等在回答“项目现在是什么”的事实。只有当前代码、机器 Contract、锁文件、CI 或实际运行结果提供充分反证时，才修正 `AGENTS.md` 中过时的描述；不要把易变函数/字段/文件树复制成第二套实现镜像。\n3. **未确认事项**：证据不足、多个事实源冲突、只有历史聊天/示例/文件名暗示，或尚未建立的工程事实。保持为未确认或不写入；如果它会改变 public Contract、Schema、数据、安全、部署或验收，则在实质修改前继续调查或请求上游决定。\n\n有界事实调查至少按实际项目选取与长期规则直接相关的最少充分证据：\n\n```text\n现有项目规则 / Owner 决定\n→ Manifest / lock / Runtime / workspace\n→ 主要生产入口与模块边界\n→ Contract / Schema / Migration（真实存在时）\n→ build / test / CI\n→ deploy / release / rollback（真实存在时）\n→ 正式 README / Architecture / Spec / ADR（受影响时）\n```\n\n不因为“首次治理”就机械读取全部源码、全部 Markdown、全部历史 PR 或大体量生成物；发现新事实只沿调用链和 Ownership 扩展到足以支持当前长期结论。Secret、凭据、生产数据仍不得读取或写入治理文档。\n\n首次治理完成后，后续任务仍按本文件的缓存/失效规则工作：普通源码变化不自动触发全量治理；只有长期治理事实变化或 `AGENTS.md` 与当前事实出现明确漂移信号时，才 targeted 重新调查受影响部分。\n\n## 持久索引\n"""
          replace_once(discovery_path, discovery_anchor, discovery_insert)

          bootstrap_path = ".agents/skills/coding/references/12_目标项目安装与AGENTS_Bootstrap.md"
          bootstrap_anchor = """Runtime 的加密、Project Payload、managed installation manifest、Codex/Cursor/Claude Code 项目 MCP 和 binary 升级规则详见 [13_本地MCP_Runtime分发与原文上下文加载.md](13_本地MCP_Runtime分发与原文上下文加载.md)。\n\n## 1. 何时读取\n"""
          bootstrap_insert = """Runtime 的加密、Project Payload、managed installation manifest、Codex/Cursor/Claude Code 项目 MCP 和 binary 升级规则详见 [13_本地MCP_Runtime分发与原文上下文加载.md](13_本地MCP_Runtime分发与原文上下文加载.md)。\n\n## 0. 两阶段 Bootstrap：安装与宿主大模型治理\n\n目标项目接入必须区分两个阶段，不能把 binary 的确定性安装和大模型语义判断混成一件事：\n\n```text\nRuntime Installation Bootstrap\n→ Runtime binary 安全安装/升级 Router、Skill、项目 MCP 与 Agent Skills managed block\n→ 没有 AGENTS 时创建结构模板和“状态：待校准”项目自有区\n→ 不调用 LLM，不扫描整个仓库推断架构\n\n用户在 Codex / Cursor / Claude Code 等宿主中提出自然语言研发任务\n→ 宿主大模型读取 AGENTS → Router → Coding\n→ 首次接入 / 状态待校准 / 长期治理事实漂移时命中 Project Governance Bootstrap\n→ 有界调查当前仓库真实实现\n→ 只在 managed block 外创建/校准项目自己的 Overlay\n→ 标记“状态：已校准”\n→ 重新读取最终 AGENTS.md\n→ 继续原始研发任务\n```\n\n因此，Runtime binary 本身不需要也不允许成为第二个 Coding Agent；**Project Governance Bootstrap 由当前项目所用的宿主大模型执行**。用户无需手工构造 Task Route 或调用内部语义扫描命令，普通开发/修复/重构等**自然语言研发任务**就可以触发这条前置规则。Runtime Mode 中宿主根据该事实把现有 `项目 Bootstrap` 意图加入 Task Route，再加载本 Reference；不新增 Stable ID、协议或第二套路由词汇。\n\n项目自己的治理状态属于 `AGENTS.md` **managed block 外**内容。新建模板使用：\n\n```text\n<!-- agent-skills:project-governance:v1 -->\n## Project Governance Bootstrap 状态\n- 状态：待校准 / 已校准\n```\n\n安装器不维护这个项目自有状态；宿主大模型只有在完成真实仓库调查和 Overlay 校准后才能改成“状态：已校准”。已有 `AGENTS.md` 第一次接入时没有该状态，也按首次治理处理。状态只是是否完成首次长期规则校准的导航，不是代码/Contract/CI 当前正确性的证明。\n\n## 1. 何时读取\n"""
          replace_once(bootstrap_path, bootstrap_anchor, bootstrap_insert)

          bootstrap_section_anchor = """## 12. 有证据的项目 Overlay 语义补全\n\n如果当前任务本身就是“安装 / 初始化 Agent_Skills、创建或完善项目 AGENTS”，且用户授权修改项目规则，Coding Agent 在确定性 Bootstrap 后还要判断是否需要有证据的语义补全：\n\n1. 重新读取 Bootstrap 后的项目 `AGENTS.md`；\n2. 只读取与长期研发导航直接相关的最少充分事实源；\n3. 可确认的长期事实可以在 managed block **之外**增量补充；\n4. 已有内容不重复、不改写，不为了风格统一重排；\n5. 不能仅凭文件名/目录名写入框架、数据库、架构、Owner、Contract、CI 或部署结论；\n6. 多个事实源冲突时继续核实，不猜一个正确；\n7. 不修改 managed block 内模板文本；\n8. 不把 Router 专业路由正文复制到项目 Overlay；\n9. Runtime binary 本身不调用 LLM 自动生成项目架构结论。\n"""
          bootstrap_section_new = """## 12. Project Governance Bootstrap：有证据的项目 Overlay 语义校准\n\n当首次接入、项目治理状态尚未校准、现有 `AGENTS.md` 与长期工程事实疑似漂移，或用户明确要求刷新项目规则，并且当前任务授权修改项目时，Coding Agent 在 Runtime Installation Bootstrap 之后执行 Project Governance Bootstrap。这个阶段由**宿主大模型**负责语义判断，不由 Runtime binary 自动改写项目规则。\n\n固定顺序：\n\n1. 重新读取安装/接入后的项目 `AGENTS.md` 以及适用的 `CONTRIBUTING` / 子目录规则；\n2. 按 ref01 做有界事实调查，只读取与长期研发导航直接相关的最少充分代码、Manifest/lock、Contract/Schema/Migration、测试、CI、部署和正式文档；\n3. 把现有 AGENTS 内容与新证据分成**规范性规则、描述性事实、未确认事项**；\n4. 规范性规则若与当前实现冲突，先把它视为实现/配置偏离；**不能通过修改 `AGENTS.md` 让错误实现合法化**，不能因为代码没有遵守就自动删除或弱化规则；\n5. 描述性事实只有在当前机器事实/代码/CI/运行证据足以证明过时时才做最小修正；不能仅凭文件名/目录名写入框架、数据库、架构、Owner、Contract、CI 或部署结论；\n6. 多个高权威事实源冲突或证据不足时保留为未确认；如果会实质改变 Contract、Schema、数据、安全、部署或验收，继续核实或请求 Owner 决策，不猜一个正确；\n7. 可确认的长期事实只在 managed block **之外**增量补充；不修改 managed block 内模板文本，不把 Router 专业路由正文复制到项目 Overlay；\n8. 已有仍有效文本尽量保持原位置和语义；只做必要的 targeted 修正，不为了套固定模板重排整份已有 AGENTS；\n9. 对新建模板，固定章节只是结构骨架；没有真实事实的章节保持为空或明确未确认，不为了“填满模板”发明制度；\n10. 首次治理成功后，在项目自有区保留 `<!-- agent-skills:project-governance:v1 -->` 并把状态更新为“状态：已校准”；已有 AGENTS 没有该项目自有状态时可在 managed block 外增量建立；\n11. **重新读取最终 `AGENTS.md`**，确认项目规则、事实描述、未确认事项和 Agent Skills managed block 边界没有互相覆盖；\n12. 然后回到用户最初的自然语言请求，按最终规则**继续原始研发任务**；治理 Bootstrap 不是把原任务替换成只写文档。\n\n后续普通开发不重复全量首次治理。每个任务仍做廉价事实/缓存失效检查；只有技术栈、模块 Owner、Contract/Schema、开发/验证入口、CI/Release/部署等长期工程事实变化时，才 targeted 调查并更新对应 Overlay。Runtime binary 本身仍不调用 LLM、不自动生成项目架构结论，也不修改项目自有治理状态。\n"""
          replace_once(bootstrap_path, bootstrap_section_anchor, bootstrap_section_new)
          PY
          git diff --check
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_project_governance_bootstrap.py' -v
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agents/skills/coding/SKILL.md .agents/skills/coding/references/01_项目发现与可失效缓存.md .agents/skills/coding/references/12_目标项目安装与AGENTS_Bootstrap.md
          git commit -m "固化项目治理Bootstrap语义规则"
          git push origin HEAD:feat/project-governance-bootstrap
