name: Skill Tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/distribution/**"
      - "docs/maintainers/**"
      - "CHANGELOG.md"
      - "VERSION"
      - ".gitignore"
      - ".agents/**"
      - "runtime/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/distribution/**"
      - "docs/maintainers/**"
      - "CHANGELOG.md"
      - "VERSION"
      - ".gitignore"
      - ".agents/**"
      - "runtime/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  skill-tests:
    name: Skill Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python version
        run: python3 --version

      - name: Install Runtime build dependencies
        run: python3 -m pip install -r runtime/requirements-build.txt

      - name: Compile helper scripts and Runtime
        run: >-
          python3 -m py_compile
          .agents/skills/coding/scripts/coding.py
          .agents/skills/coding/scripts/ready_check.py
          scripts/install.py
          scripts/build_full_distribution.py
          scripts/build_runtime.py
          scripts/install_runtime.py
          scripts/install_runtime_target.py
          scripts/runtime_mcp_smoke.py
          runtime/agent_skills_runtime/skill_catalog.py
          runtime/agent_skills_runtime/catalog.py
          runtime/agent_skills_runtime/crypto.py
          runtime/agent_skills_runtime/project_payload.py
          runtime/agent_skills_runtime/project_installer.py
          runtime/agent_skills_runtime/runtime.py
          runtime/agent_skills_runtime/server.py

      - name: Smoke maintained CLI entrypoints
        run: |
          python3 .agents/skills/coding/scripts/coding.py bootstrap --help
          python3 scripts/install.py --help
          python3 scripts/build_full_distribution.py --help
          python3 scripts/build_runtime.py --help
          python3 scripts/runtime_mcp_smoke.py --help

      - name: Run self-contained tests
        run: >-
          python3 -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_*.py'
          -v

      - name: Build and verify Full Distribution Kit
        run: |
          python3 scripts/build_full_distribution.py --output-dir .full-dist --json
          VERSION="$(tr -d '\r\n' < VERSION)"
          kit_zip=".full-dist/agent-skills-full-kit-v${VERSION}.zip"
          extract_root="${RUNNER_TEMP}/agent-skills-full-extracted"
          target="${RUNNER_TEMP}/agent-skills-full-target"
          mkdir -p "${extract_root}" "${target}"
          test -f "${kit_zip}"
          python3 -m zipfile -e "${kit_zip}" "${extract_root}"
          kit="${extract_root}/agent-skills-full-kit-v${VERSION}"
          cd "${RUNNER_TEMP}"
          python3 "${kit}/scripts/install.py" --target "${target}" --json
          test -f "${target}/AGENTS.md"
          test -f "${target}/.agents/skills/coding/references/02_跨项目研发任务路由.md"

      - name: Build and self-test onefile Runtime
        run: |
          python3 scripts/build_runtime.py --output-dir .runtime-dist --json
          .runtime-dist/agent-skills-mcp status --json
          .runtime-dist/agent-skills-mcp self-test --json
          VERSION="$(tr -d '\r\n' < VERSION)"
          grep -Fq "\"release_version\": \"${VERSION}\"" .runtime-dist/agent-skills-mcp.manifest.json
          test ! -e .runtime-dist/agent-skills-mcp-runtime-kit.zip

      - name: Verify real stdio MCP contract
        run: >-
          python3 scripts/runtime_mcp_smoke.py
          --artifact .runtime-dist/agent-skills-mcp
          --json

      - name: Verify project-only single-binary installation
        run: |
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          target="${RUNNER_TEMP}/agent-skills-project-target"
          no_args_target="${RUNNER_TEMP}/agent-skills-project-no-args"
          mkdir -p "${target}" "${no_args_target}"

          "${artifact}" install --target "${target}" --json
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          test -f "${target}/.agents/agent-skills-install.json"
          test -f "${target}/.cursor/mcp.json"
          test -f "${target}/.mcp.json"
          test -f "${target}/.codex/config.toml"
          test -f "${target}/CLAUDE.md"
          grep -q "agent_skills_load_context" "${target}/.agents/skills/coding/references/02_跨项目研发任务路由.md"
          ! grep -Fq "# 跨项目研发任务路由" "${target}/.agents/skills/coding/references/02_跨项目研发任务路由.md"
          grep -Fq "/.agents/runtime/" "${target}/.gitignore"
          test "$(grep -c '<!-- agent-skills:managed:start -->' "${target}/AGENTS.md")" -eq 1
          "${target}/.agents/runtime/agent-skills-mcp" status --json
          python3 scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          cd "${no_args_target}"
          "${artifact}"
          test -x "${no_args_target}/.agents/runtime/agent-skills-mcp"
          test -f "${no_args_target}/.agents/agent-skills-install.json"

      - name: Verify active Coding Change
        run: >-
          python3 .agents/skills/coding/scripts/ready_check.py
          --root .
          --require-active-ready

  runtime-windows-package:
    name: Runtime Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and self-test Windows onefile Runtime
        shell: pwsh
        run: |
          python scripts/build_runtime.py --output-dir .runtime-dist --json
          .\.runtime-dist\agent-skills-mcp.exe status --json
          .\.runtime-dist\agent-skills-mcp.exe self-test --json
          python scripts/runtime_mcp_smoke.py --artifact .\.runtime-dist\agent-skills-mcp.exe --json
          if (Test-Path .\.runtime-dist\agent-skills-mcp-runtime-kit.zip) { throw "不应再生成 Windows Runtime Kit" }
          $version = (Get-Content VERSION -Raw).Trim()
          $manifest = Get-Content .\.runtime-dist\agent-skills-mcp.manifest.json -Raw | ConvertFrom-Json
          if ($manifest.release_version -ne $version) { throw "Runtime manifest release_version 与 VERSION 不一致" }

      - name: Verify Windows project-only single-binary installation
        shell: pwsh
        run: |
          $artifact = (Resolve-Path .\.runtime-dist\agent-skills-mcp.exe).Path
          $target = Join-Path $env:RUNNER_TEMP "agent-skills-project-target"
          $noArgsTarget = Join-Path $env:RUNNER_TEMP "agent-skills-project-no-args"
          New-Item -ItemType Directory -Force -Path $target, $noArgsTarget | Out-Null

          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目首次安装失败" }
          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目重复升级失败" }

          $installedRuntime = Join-Path $target ".agents\runtime\agent-skills-mcp.exe"
          $manifest = Join-Path $target ".agents\agent-skills-install.json"
          $stub = Join-Path $target ".agents\skills\coding\references\02_跨项目研发任务路由.md"
          foreach ($path in @(
            $installedRuntime,
            $manifest,
            (Join-Path $target ".cursor\mcp.json"),
            (Join-Path $target ".mcp.json"),
            (Join-Path $target ".codex\config.toml"),
            (Join-Path $target "CLAUDE.md")
          )) {
            if (-not (Test-Path $path)) { throw "Windows 项目安装缺少文件: $path" }
          }
          if (-not (Select-String -Path $stub -Pattern "agent_skills_load_context" -Quiet)) { throw "Windows Runtime Stub 未接入 MCP" }
          & $installedRuntime status --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime status 失败" }
          python scripts/runtime_mcp_smoke.py --artifact $installedRuntime --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime MCP smoke 失败" }

          Push-Location $noArgsTarget
          try {
            & $artifact
            if ($LASTEXITCODE -ne 0) { throw "Windows binary 无参数项目安装失败" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\runtime\agent-skills-mcp.exe"))) {
            throw "Windows binary 无参数运行未安装项目 Runtime"
          }

  runtime-macos-package:
    name: Runtime macOS Package
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python version
        run: python3 --version

      - name: Install Runtime build dependencies
        run: |
          python3 -m venv .venv-runtime
          .venv-runtime/bin/python -m pip install -r runtime/requirements-build.txt
          echo "${GITHUB_WORKSPACE}/.venv-runtime/bin" >> "${GITHUB_PATH}"

      - name: Build and self-test macOS onefile Runtime
        run: |
          python3 scripts/build_runtime.py --output-dir .runtime-dist --json
          .runtime-dist/agent-skills-mcp status --json
          .runtime-dist/agent-skills-mcp self-test --json
          python3 scripts/runtime_mcp_smoke.py --artifact .runtime-dist/agent-skills-mcp --json
          test ! -e .runtime-dist/agent-skills-mcp-runtime-kit.zip
          VERSION="$(tr -d '\r\n' < VERSION)"
          grep -Fq "\"release_version\": \"${VERSION}\"" .runtime-dist/agent-skills-mcp.manifest.json

      - name: Verify macOS project-only single-binary installation
        run: |
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          target="${RUNNER_TEMP}/agent-skills-project-target"
          no_args_target="${RUNNER_TEMP}/agent-skills-project-no-args"
          mkdir -p "${target}" "${no_args_target}"

          "${artifact}" install --target "${target}" --json
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          test -f "${target}/.agents/agent-skills-install.json"
          test -f "${target}/.cursor/mcp.json"
          test -f "${target}/.mcp.json"
          test -f "${target}/.codex/config.toml"
          test -f "${target}/CLAUDE.md"
          grep -q "agent_skills_load_context" "${target}/.agents/skills/coding/references/02_跨项目研发任务路由.md"
          "${target}/.agents/runtime/agent-skills-mcp" status --json
          python3 scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          cd "${no_args_target}"
          "${artifact}"
          test -x "${no_args_target}/.agents/runtime/agent-skills-mcp"
          test -f "${no_args_target}/.agents/agent-skills-install.json"
