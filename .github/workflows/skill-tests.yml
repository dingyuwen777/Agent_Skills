name: Skill Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: agent-skills-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-skills-core:
    name: Agent Skills Gate
    runs-on: ubuntu-24.04
    outputs:
      runtime_scope: ${{ steps.runtime-scope.outputs.runtime_scope }}
      semantic_profile: ${{ steps.runtime-scope.outputs.semantic_profile }}
      package_evidence_required: ${{ steps.runtime-scope.outputs.package_evidence_required }}
      change_gate_ready: ${{ steps.change-gate.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: 'pip'
          cache-dependency-path: |
            runtime/requirements.txt
            runtime/requirements-build.txt

      - name: Verify PR Requirement Source
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_pr_requirement_source.py --root .

      - name: Detect changed-scope Evidence
        id: runtime-scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${GITHUB_SHA}"
          fi

          selection="${RUNNER_TEMP}/ci-evidence-selection.json"
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            printf '' | python .github/scripts/runtime_package_scope.py --json > "${selection}"
          else
            git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}" \
              | python .github/scripts/runtime_package_scope.py --json > "${selection}"
          fi
          cat "${selection}"

          runtime_scope="$(jq -r '.runtime_scope' "${selection}")"
          semantic_profile="$(jq -r '.semantic_profile' "${selection}")"
          runtime_dependencies_required="$(jq -r '.runtime_dependencies_required' "${selection}")"
          compile_required="$(jq -r '.compile_required' "${selection}")"
          cli_smoke_required="$(jq -r '.cli_smoke_required' "${selection}")"
          semantic_tests_required="$(jq -r '.semantic_tests_required' "${selection}")"
          full_required="$(jq -r '.full_required' "${selection}")"

          package_evidence_required=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            package_evidence_required=false
          fi

          {
            echo "runtime_scope=${runtime_scope}"
            echo "semantic_profile=${semantic_profile}"
            echo "runtime_dependencies_required=${runtime_dependencies_required}"
            echo "compile_required=${compile_required}"
            echo "cli_smoke_required=${cli_smoke_required}"
            echo "semantic_tests_required=${semantic_tests_required}"
            echo "full_required=${full_required}"
            echo "package_evidence_required=${package_evidence_required}"
            echo "selection=${selection}"
          } >> "${GITHUB_OUTPUT}"

          case "${runtime_scope}" in
            change_only)
              echo "Change carrier only; semantic/package Evidence is not applicable."
              ;;
            governance|content)
              echo "Selected semantic profile=${semantic_profile}; only directly related semantic Evidence will run."
              ;;
            package)
              if [[ "${package_evidence_required}" == "true" ]]; then
                echo "Package/control-plane risk detected; full semantic plus Linux/Windows/macOS package Evidence is required."
              else
                echo "Package risk detected on Draft PR; full semantic runs now, three-platform package Evidence waits for Ready."
              fi
              ;;
            *)
              echo "Unknown Runtime package scope: ${runtime_scope}" >&2
              exit 1
              ;;
          esac

      - name: Python version
        run: python --version

      - name: Install Runtime dependencies
        if: steps.runtime-scope.outputs.runtime_dependencies_required == 'true'
        run: python -m pip install -r runtime/requirements.txt

      - name: Compile selected maintained entrypoints
        if: steps.runtime-scope.outputs.compile_required == 'true'
        run: >-
          python -m py_compile
          .agents/skills/coding/scripts/coding.py
          .agents/skills/coding/scripts/ready_check.py
          .github/scripts/check_pr_requirement_source.py
          .github/scripts/archive_change_after_merge.py
          .github/scripts/runtime_package_scope.py
          licensing/license_tool.py
          scripts/build_runtime.py
          scripts/runtime_mcp_smoke.py
          scripts/runtime_platform_smoke.py
          runtime/agent_skills_runtime/skill_catalog.py
          runtime/agent_skills_runtime/routing.py
          runtime/agent_skills_runtime/catalog.py
          runtime/agent_skills_runtime/crypto.py
          runtime/agent_skills_runtime/encrypted_bundle.py
          runtime/agent_skills_runtime/project_payload.py
          runtime/agent_skills_runtime/install_state.py
          runtime/agent_skills_runtime/licensing.py
          runtime/agent_skills_runtime/project_installer.py
          runtime/agent_skills_runtime/runtime.py
          runtime/agent_skills_runtime/server.py

      - name: Smoke selected CLI entrypoints
        if: steps.runtime-scope.outputs.cli_smoke_required == 'true'
        run: |
          python .agents/skills/coding/scripts/coding.py bootstrap --help
          python .agents/skills/coding/scripts/ready_check.py --help
          python .github/scripts/check_pr_requirement_source.py --help
          python .github/scripts/archive_change_after_merge.py --help
          python .github/scripts/runtime_package_scope.py --help
          python scripts/build_runtime.py --help
          python scripts/runtime_mcp_smoke.py --help
          python scripts/runtime_platform_smoke.py --help

      - name: Run selected self-contained tests
        if: steps.runtime-scope.outputs.semantic_tests_required == 'true'
        shell: bash
        run: |
          set +e
          python .github/scripts/runtime_package_scope.py \
            --run-selected-tests "${{ steps.runtime-scope.outputs.selection }}" \
            --root . > self-contained-tests.log 2>&1
          exit_code=$?
          cat self-contained-tests.log
          if [ "${exit_code}" -ne 0 ]; then
            {
              echo "### Selected self-contained test failure summary"
              echo '```text'
              tail -n 160 self-contained-tests.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(tail -n 120 self-contained-tests.log | python -c 'import sys; text=sys.stdin.read(); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')"
            echo "::error title=Selected self-contained tests failed::${annotation}"
            exit "${exit_code}"
          fi

      - name: Verify current Coding Change readiness
        id: change-readiness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python .agents/skills/coding/scripts/ready_check.py \
              --root . \
              --changed-since "${{ github.event.pull_request.base.sha }}"
          else
            python .agents/skills/coding/scripts/ready_check.py \
              --root . \
              --require-active-ready
          fi

      - name: Capture Coding Change readiness
        id: change-gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.change-readiness.outcome }}" == "success" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Current Coding Change is not Ready; required Runtime Package Gate will remain fail-closed."
          fi

      - name: Enforce current Coding Change readiness
        if: steps.change-gate.outputs.ready != 'true'
        shell: bash
        run: |
          echo "Current Coding Change is not Ready; Agent Skills Gate remains fail-closed." >&2
          exit 1

  runtime-package:
    name: Runtime ${{ matrix.platform }} Package
    needs: agent-skills-core
    if: needs.agent-skills-core.outputs.runtime_scope == 'package' && needs.agent-skills-core.outputs.package_evidence_required == 'true' && needs.agent-skills-core.outputs.change_gate_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
          - platform: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: 'pip'
          cache-dependency-path: runtime/requirements-build.txt

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and verify ${{ matrix.platform }} onefile Runtime
        run: >-
          python scripts/runtime_platform_smoke.py
          --output-dir .runtime-dist
          --release-version 0.0.0-dev
          --expected-python-version 3.14.7
          --target-root "${{ runner.temp }}"
          --verify-no-args
          --json

  runtime-package-gate:
    name: Runtime Package Gate
    # selector 已证明非 package 时，required job 直接 skipped，不分配 Runner；
    # package 才启动真实聚合 Runner，并继续对 Ready/三平台 Evidence fail-closed。
    if: always() && needs.agent-skills-core.outputs.runtime_scope == 'package'
    needs:
      - agent-skills-core
      - runtime-package
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required Runtime package evidence
        shell: bash
        env:
          CORE_RESULT: ${{ needs.agent-skills-core.result }}
          PACKAGE_EVIDENCE_REQUIRED: ${{ needs.agent-skills-core.outputs.package_evidence_required }}
          CHANGE_GATE_READY: ${{ needs.agent-skills-core.outputs.change_gate_ready }}
          PACKAGE_RESULT: ${{ needs.runtime-package.result }}
        run: |
          set -euo pipefail
          if [[ "${CHANGE_GATE_READY}" != "true" ]]; then
            echo "Current Coding Change is not Ready; Runtime Package Gate remains fail-closed." >&2
            exit 1
          fi
          if [[ "${PACKAGE_EVIDENCE_REQUIRED}" != "true" ]]; then
            echo "Package evidence is deferred while the PR is Draft; mark the PR Ready for review to run Linux/Windows/macOS package evidence." >&2
            exit 1
          fi
          test "${CORE_RESULT}" = "success"
          test "${PACKAGE_RESULT}" = "success"


  actions-hygiene:
    name: Actions Hygiene
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.agent-skills-core.result == 'success' &&
      (needs.agent-skills-core.outputs.runtime_scope != 'package' ||
       needs.runtime-package-gate.result == 'success')
    needs:
      - agent-skills-core
      - runtime-package
      - runtime-package-gate
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout current main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reconcile obsolete workflow history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/actions-hygiene.json"
          if ! python .github/scripts/actions_hygiene.py \
            --root . \
            --repository "${GITHUB_REPOSITORY}" \
            --execute \
            --json | tee "${report}"; then
            echo "::warning::Actions Hygiene failed; cleanup is deferred to the next healthy main push."
            exit 0
          fi
