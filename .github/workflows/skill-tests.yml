name: Skill Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  requirement-source:
    name: Requirement Source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify PR Requirement Source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_pr_requirement_source.py --root .

  skill-tests:
    name: Skill Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Python version
        run: python --version

      - name: Install Runtime dependencies
        run: python -m pip install -r runtime/requirements.txt

      - name: Compile maintained scripts and Runtime
        run: >-
          python -m py_compile
          .agents/skills/coding/scripts/coding.py
          .agents/skills/coding/scripts/ready_check.py
          .github/scripts/check_pr_requirement_source.py
          .github/scripts/runtime_package_scope.py
          scripts/build_runtime.py
          scripts/runtime_mcp_smoke.py
          runtime/agent_skills_runtime/skill_catalog.py
          runtime/agent_skills_runtime/routing.py
          runtime/agent_skills_runtime/catalog.py
          runtime/agent_skills_runtime/crypto.py
          runtime/agent_skills_runtime/encrypted_bundle.py
          runtime/agent_skills_runtime/project_payload.py
          runtime/agent_skills_runtime/install_state.py
          runtime/agent_skills_runtime/project_installer.py
          runtime/agent_skills_runtime/runtime.py
          runtime/agent_skills_runtime/server.py

      - name: Smoke maintained CLI entrypoints
        run: |
          python .agents/skills/coding/scripts/coding.py bootstrap --help
          python .github/scripts/check_pr_requirement_source.py --help
          python .github/scripts/runtime_package_scope.py --help
          python scripts/build_runtime.py --help
          python scripts/runtime_mcp_smoke.py --help

      - name: Run self-contained tests
        shell: bash
        run: |
          set +e
          python -m unittest discover \
            -s .agents/skills/coding/tests \
            -p 'test_*.py' \
            -v > self-contained-tests.log 2>&1
          exit_code=$?
          cat self-contained-tests.log
          if [ "${exit_code}" -ne 0 ]; then
            {
              echo "### Self-contained test failure summary"
              echo '```text'
              tail -n 160 self-contained-tests.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(tail -n 120 self-contained-tests.log | python -c 'import sys; text=sys.stdin.read(); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')"
            echo "::error title=Self-contained tests failed::${annotation}"
            exit "${exit_code}"
          fi

      - name: Verify active Coding Change
        if: github.event_name == 'push'
        run: >-
          python .agents/skills/coding/scripts/ready_check.py
          --root .
          --require-active-ready

      - name: Verify changed Coding Change
        if: github.event_name == 'pull_request'
        run: >-
          python .agents/skills/coding/scripts/ready_check.py
          --root .
          --changed-since ${{ github.event.pull_request.base.sha }}

  agent-skills-gate:
    name: Agent Skills Gate
    if: always()
    needs:
      - requirement-source
      - skill-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required core governance evidence
        shell: bash
        env:
          REQUIREMENT_SOURCE_RESULT: ${{ needs.requirement-source.result }}
          SKILL_TESTS_RESULT: ${{ needs.skill-tests.result }}
        run: |
          set -euo pipefail
          test "${REQUIREMENT_SOURCE_RESULT}" = "success"
          test "${SKILL_TESTS_RESULT}" = "success"

  cleanup-task-branches:
    name: Cleanup Current Task Branches
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'finalize/ci-workflow-minimal-sufficiency'
    needs:
      - agent-skills-gate
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Delete exact current-task refs and verify cleanup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 08cfed06a82f726902435f607c9449597e4b19a1
          CLEANUP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          api = os.environ["GITHUB_API_URL"]
          token = os.environ["GITHUB_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          cleanup_head = os.environ["CLEANUP_HEAD_SHA"]
          carrier = "finalize/ci-workflow-minimal-sufficiency"
          other = "finalize/ci-workflow-minimal-sufficiency-archive"
          targets = (other, carrier)

          if carrier in {"main", "master"} or other in {"main", "master"}:
              raise SystemExit("cleanup target must never be a default-branch name")
          if not all(name.startswith("finalize/ci-workflow-minimal-sufficiency") for name in targets):
              raise SystemExit("cleanup target escaped the exact current-task namespace")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "agent-skills-current-task-cleanup",
          }

          def request(method: str, path: str, *, allow_404: bool = False):
              req = urllib.request.Request(f"{api}/repos/{repo}{path}", headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = response.read()
                      return response.status, json.loads(payload) if payload else None
              except urllib.error.HTTPError as error:
                  if allow_404 and error.code == 404:
                      return 404, None
                  detail = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: {error.code} {detail}") from error

          status, main_ref = request("GET", "/git/ref/heads/main")
          if status != 200 or main_ref["object"]["sha"] != expected_main:
              raise SystemExit("main moved or no longer matches the verified finalization revision")

          expected = {carrier: cleanup_head, other: expected_main}
          for branch, sha in expected.items():
              encoded = urllib.parse.quote(branch, safe="")
              status, ref = request("GET", f"/git/ref/heads/{encoded}")
              if status != 200 or ref["object"]["sha"] != sha:
                  raise SystemExit(f"ref preflight mismatch for {branch}")

          for branch in targets:
              encoded = urllib.parse.quote(branch, safe="")
              status, _ = request("DELETE", f"/git/refs/heads/{encoded}")
              if status != 204:
                  raise SystemExit(f"unexpected delete status for {branch}: {status}")
              print(f"DELETED_CURRENT_TASK_REF={branch}")

          for branch in targets:
              encoded = urllib.parse.quote(branch, safe="")
              status, _ = request("GET", f"/git/ref/heads/{encoded}", allow_404=True)
              if status != 404:
                  raise SystemExit(f"ref still exists after cleanup: {branch}")

          status, main_ref = request("GET", "/git/ref/heads/main")
          if status != 200 or main_ref["object"]["sha"] != expected_main:
              raise SystemExit("main changed during task-branch cleanup")
          print("CURRENT_TASK_BRANCH_CLEANUP=success")
          PY
