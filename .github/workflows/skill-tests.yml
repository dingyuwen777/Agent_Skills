name: Skill Tests

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "USAGE.md"
      - ".gitignore"
      - ".agents/**"
      - "runtime/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "README.md"
      - "USAGE.md"
      - ".gitignore"
      - ".agents/**"
      - "runtime/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  skill-tests:
    name: Skill Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Compile maintained scripts and Runtime
        run: >-
          python -m py_compile
          .agents/skills/coding/scripts/coding.py
          .agents/skills/coding/scripts/ready_check.py
          scripts/build_runtime.py
          scripts/runtime_mcp_smoke.py
          runtime/agent_skills_runtime/skill_catalog.py
          runtime/agent_skills_runtime/routing.py
          runtime/agent_skills_runtime/catalog.py
          runtime/agent_skills_runtime/crypto.py
          runtime/agent_skills_runtime/project_payload.py
          runtime/agent_skills_runtime/project_installer.py
          runtime/agent_skills_runtime/runtime.py
          runtime/agent_skills_runtime/server.py

      - name: Smoke maintained CLI entrypoints
        run: |
          python .agents/skills/coding/scripts/coding.py bootstrap --help
          python scripts/build_runtime.py --help
          python scripts/runtime_mcp_smoke.py --help

      - name: Run self-contained tests
        run: >-
          python -m unittest discover
          -s .agents/skills/coding/tests
          -p 'test_*.py'
          -v

      - name: Build and self-test onefile Runtime
        run: |
          python scripts/build_runtime.py --output-dir .runtime-dist --json
          .runtime-dist/agent-skills-mcp status --json
          .runtime-dist/agent-skills-mcp self-test --json
          grep -Fq '"release_version": "0.0.0-dev"' .runtime-dist/agent-skills-mcp.manifest.json
          grep -Fq '"python_version": "3.12.10"' .runtime-dist/agent-skills-mcp.manifest.json
          test ! -e .runtime-dist/agent-skills-mcp-runtime-kit.zip

      - name: Verify real stdio MCP contract
        run: >-
          python scripts/runtime_mcp_smoke.py
          --artifact .runtime-dist/agent-skills-mcp
          --json

      - name: Verify project-only single-binary installation
        run: |
          artifact="${GITHUB_WORKSPACE}/.runtime-dist/agent-skills-mcp"
          target="${RUNNER_TEMP}/agent-skills-project-target"
          no_args_target="${RUNNER_TEMP}/agent-skills-project-no-args"
          mkdir -p "${target}" "${no_args_target}"

          "${artifact}" install --target "${target}" --json
          "${artifact}" install --target "${target}" --json
          test -x "${target}/.agents/runtime/agent-skills-mcp"
          test -f "${target}/.agents/agent-skills-install.json"
          test -f "${target}/.cursor/mcp.json"
          test -f "${target}/.mcp.json"
          test -f "${target}/.codex/config.toml"
          test -f "${target}/CLAUDE.md"
          test -f "${target}/.agents/skills/ROUTER.md"
          grep -Fq ".agents/skills/ROUTER.md" "${target}/AGENTS.md"
          ! grep -Fq "agent_skills_load_required_context" "${target}/AGENTS.md"
          grep -Fq ".agents/skills/coding/SKILL.md" "${target}/.agents/skills/ROUTER.md"
          grep -Fq "agent_skills_load_required_context" "${target}/.agents/skills/ROUTER.md"
          grep -Fq '"schema": "agent-skills-install/v3"' "${target}/.agents/agent-skills-install.json"
          grep -Fq '"managed_files"' "${target}/.agents/agent-skills-install.json"
          grep -Fq '"ROUTER.md"' "${target}/.agents/agent-skills-install.json"
          test ! -e "${target}/.agents/skills/coding/references"
          grep -Fq "/.agents/runtime/" "${target}/.gitignore"
          test "$(grep -c '<!-- agent-skills:managed:start -->' "${target}/AGENTS.md")" -eq 1
          "${target}/.agents/runtime/agent-skills-mcp" status --json
          python scripts/runtime_mcp_smoke.py --artifact "${target}/.agents/runtime/agent-skills-mcp" --json

          cd "${no_args_target}"
          "${artifact}"
          test -x "${no_args_target}/.agents/runtime/agent-skills-mcp"
          test -f "${no_args_target}/.agents/agent-skills-install.json"
          test -f "${no_args_target}/.agents/skills/ROUTER.md"
          grep -Fq ".agents/skills/ROUTER.md" "${no_args_target}/AGENTS.md"

      - name: Verify active Coding Change
        run: >-
          python .agents/skills/coding/scripts/ready_check.py
          --root .
          --require-active-ready

  runtime-windows-package:
    name: Runtime Windows Package
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Python version
        run: python --version

      - name: Install Runtime build dependencies
        run: python -m pip install -r runtime/requirements-build.txt

      - name: Build and self-test Windows onefile Runtime
        shell: pwsh
        run: |
          python scripts/build_runtime.py --output-dir .runtime-dist --json
          .\.runtime-dist\agent-skills-mcp.exe status --json
          .\.runtime-dist\agent-skills-mcp.exe self-test --json
          python scripts/runtime_mcp_smoke.py --artifact .\.runtime-dist\agent-skills-mcp.exe --json
          if (Test-Path .\.runtime-dist\agent-skills-mcp-runtime-kit.zip) { throw "不应生成 Windows Runtime Kit" }
          $manifest = Get-Content .\.runtime-dist\agent-skills-mcp.manifest.json -Raw | ConvertFrom-Json
          if ($manifest.release_version -ne "0.0.0-dev") { throw "普通 CI Runtime manifest 必须使用 development version" }
          if ($manifest.python_version -ne "3.12.10") { throw "Runtime manifest Python 版本不是 3.12.10" }

      - name: Verify Windows project-only single-binary installation
        shell: pwsh
        run: |
          $artifact = (Resolve-Path .\.runtime-dist\agent-skills-mcp.exe).Path
          $target = Join-Path $env:RUNNER_TEMP "agent-skills-project-target"
          $noArgsTarget = Join-Path $env:RUNNER_TEMP "agent-skills-project-no-args"
          New-Item -ItemType Directory -Force -Path $target, $noArgsTarget | Out-Null

          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目首次安装失败" }
          & $artifact install --target $target --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目重复升级失败" }

          $installedRuntime = Join-Path $target ".agents\runtime\agent-skills-mcp.exe"
          $manifest = Join-Path $target ".agents\agent-skills-install.json"
          $router = Join-Path $target ".agents\skills\ROUTER.md"
          $agents = Join-Path $target "AGENTS.md"
          foreach ($path in @(
            $installedRuntime,
            $manifest,
            $router,
            $agents,
            (Join-Path $target ".cursor\mcp.json"),
            (Join-Path $target ".mcp.json"),
            (Join-Path $target ".codex\config.toml"),
            (Join-Path $target "CLAUDE.md")
          )) {
            if (-not (Test-Path $path)) { throw "Windows 项目安装缺少文件: $path" }
          }
          if (-not (Select-String -Path $agents -Pattern ".agents/skills/ROUTER.md" -SimpleMatch -Quiet)) { throw "Windows 目标 AGENTS 未指向 Router" }
          if (Select-String -Path $agents -Pattern "agent_skills_load_required_context" -SimpleMatch -Quiet) { throw "Windows 目标 AGENTS 不应复制完整 Router" }
          if (-not (Select-String -Path $router -Pattern ".agents/skills/coding/SKILL.md" -SimpleMatch -Quiet)) { throw "Windows Router 未指向 Coding Skill" }
          if (-not (Select-String -Path $router -Pattern "agent_skills_load_required_context" -SimpleMatch -Quiet)) { throw "Windows Router 未保留 Runtime required Context 路由" }
          $installManifest = Get-Content $manifest -Raw | ConvertFrom-Json
          if ($installManifest.schema -ne "agent-skills-install/v3") { throw "Windows install manifest schema 不是 v3" }
          if (@($installManifest.shared_files) -notcontains "ROUTER.md") { throw "Windows install manifest 未认领 ROUTER.md" }
          if (@($installManifest.managed_files).Count -eq 0) { throw "Windows install manifest 缺少 managed_files" }
          if (Test-Path (Join-Path $target ".agents\skills\coding\references")) { throw "Windows 目标项目不应安装 Reference 或 Stub" }
          & $installedRuntime status --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime status 失败" }
          python scripts/runtime_mcp_smoke.py --artifact $installedRuntime --json
          if ($LASTEXITCODE -ne 0) { throw "Windows 项目 Runtime MCP smoke 失败" }

          Push-Location $noArgsTarget
          try {
            & $artifact
            if ($LASTEXITCODE -ne 0) { throw "Windows binary 无参数项目安装失败" }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\runtime\agent-skills-mcp.exe"))) {
            throw "Windows binary 无参数运行未安装项目 Runtime"
          }
          if (-not (Test-Path (Join-Path $noArgsTarget ".agents\skills\ROUTER.md"))) {
            throw "Windows binary 无参数运行未安装 Router"
          }
          if (-not (Select-String -Path (Join-Path $noArgsTarget "AGENTS.md") -Pattern ".agents/skills/ROUTER.md" -SimpleMatch -Quiet)) {
            throw "Windows binary 无参数运行的 AGENTS 未指向 Router"
          }

