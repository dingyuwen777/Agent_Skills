name: Skill Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  cleanup-stale-workflow-runs:
    name: Cleanup Stale Workflow Runs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Delete runs for removed workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          allowed_paths = {
              ".github/workflows/release.yml",
              ".github/workflows/runtime-package-tests.yml",
              ".github/workflows/skill-tests.yml",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "agent-skills-actions-history-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def load_runs():
              runs = []
              for page in range(1, 101):
                  url = (
                      f"https://api.github.com/repos/{repository}/actions/runs"
                      f"?per_page=100&page={page}"
                  )
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  page_runs = payload.get("workflow_runs")
                  if not isinstance(page_runs, list):
                      raise SystemExit("GitHub Actions runs 响应缺少 workflow_runs 列表")
                  if not page_runs:
                      return runs
                  runs.extend(page_runs)
              raise SystemExit("GitHub Actions runs 分页超过安全上限 100 页")

          before = load_runs()
          allowed_ids_before = {
              int(run["id"])
              for run in before
              if str(run.get("path") or "") in allowed_paths
          }
          stale = []
          for run in before:
              path = str(run.get("path") or "")
              if path in allowed_paths:
                  continue
              status = str(run.get("status") or "")
              if status != "completed":
                  raise SystemExit(
                      "存在非正式 workflow 尚未完成，拒绝删除："
                      f"id={run.get('id')} name={run.get('name')} path={path} status={status}"
                  )
              stale.append(
                  (
                      int(run["id"]),
                      str(run.get("name") or ""),
                      path,
                  )
              )

          print(f"STALE_WORKFLOW_RUNS_COUNT={len(stale)}")
          for name, path in sorted({(name, path) for _, name, path in stale}):
              print(f"STALE_WORKFLOW={name} | {path}")

          for run_id, name, path in stale:
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
              request = urllib.request.Request(
                  url,
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise SystemExit(
                              f"删除 workflow run 返回异常状态：id={run_id} status={response.status}"
                          )
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      "删除 workflow run 失败："
                      f"id={run_id} name={name} path={path} http={error.code}"
                  ) from error

          after = load_runs()
          stale_after = [
              run
              for run in after
              if str(run.get("path") or "") not in allowed_paths
          ]
          if stale_after:
              preview = [
                  {
                      "id": run.get("id"),
                      "name": run.get("name"),
                      "path": run.get("path"),
                      "status": run.get("status"),
                  }
                  for run in stale_after[:20]
              ]
              raise SystemExit(
                  "清理后仍存在非正式 workflow runs："
                  + json.dumps(preview, ensure_ascii=False)
              )

          allowed_ids_after = {
              int(run["id"])
              for run in after
              if str(run.get("path") or "") in allowed_paths
          }
          missing_allowed = sorted(allowed_ids_before - allowed_ids_after)
          if missing_allowed:
              raise SystemExit(
                  "正式 workflow 历史 run 意外减少："
                  + ",".join(str(item) for item in missing_allowed[:20])
              )

          print("STALE_WORKFLOW_RUNS_AFTER=0")
          print(f"PRESERVED_FORMAL_RUNS={len(allowed_ids_after)}")
          PY

  requirement-source:
    name: Requirement Source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Verify PR Requirement Source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_pr_requirement_source.py --root .

  skill-tests:
    name: Skill Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Python version
        run: python --version

      - name: Install Runtime dependencies
        run: python -m pip install -r runtime/requirements.txt

      - name: Compile maintained scripts and Runtime
        run: >-
          python -m py_compile
          .agents/skills/coding/scripts/coding.py
          .agents/skills/coding/scripts/ready_check.py
          .github/scripts/check_pr_requirement_source.py
          .github/scripts/runtime_package_scope.py
          scripts/build_runtime.py
          scripts/runtime_mcp_smoke.py
          runtime/agent_skills_runtime/skill_catalog.py
          runtime/agent_skills_runtime/routing.py
          runtime/agent_skills_runtime/catalog.py
          runtime/agent_skills_runtime/crypto.py
          runtime/agent_skills_runtime/encrypted_bundle.py
          runtime/agent_skills_runtime/project_payload.py
          runtime/agent_skills_runtime/install_state.py
          runtime/agent_skills_runtime/project_installer.py
          runtime/agent_skills_runtime/runtime.py
          runtime/agent_skills_runtime/server.py

      - name: Smoke maintained CLI entrypoints
        run: |
          python .agents/skills/coding/scripts/coding.py bootstrap --help
          python .github/scripts/check_pr_requirement_source.py --help
          python .github/scripts/runtime_package_scope.py --help
          python scripts/build_runtime.py --help
          python scripts/runtime_mcp_smoke.py --help

      - name: Run self-contained tests
        shell: bash
        run: |
          set +e
          python -m unittest discover \
            -s .agents/skills/coding/tests \
            -p 'test_*.py' \
            -v > self-contained-tests.log 2>&1
          exit_code=$?
          cat self-contained-tests.log
          if [ "${exit_code}" -ne 0 ]; then
            {
              echo "### Self-contained test failure summary"
              echo '```text'
              tail -n 160 self-contained-tests.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            annotation="$(tail -n 120 self-contained-tests.log | python -c 'import sys; text=sys.stdin.read(); print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"), end="")')"
            echo "::error title=Self-contained tests failed::${annotation}"
            exit "${exit_code}"
          fi

      - name: Verify active Coding Change
        if: github.event_name == 'push'
        run: >-
          python .agents/skills/coding/scripts/ready_check.py
          --root .
          --require-active-ready

      - name: Verify changed Coding Change
        if: github.event_name == 'pull_request'
        run: >-
          python .agents/skills/coding/scripts/ready_check.py
          --root .
          --changed-since ${{ github.event.pull_request.base.sha }}

  agent-skills-gate:
    name: Agent Skills Gate
    if: always()
    needs:
      - requirement-source
      - skill-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required core governance evidence
        shell: bash
        env:
          REQUIREMENT_SOURCE_RESULT: ${{ needs.requirement-source.result }}
          SKILL_TESTS_RESULT: ${{ needs.skill-tests.result }}
        run: |
          set -euo pipefail
          test "${REQUIREMENT_SOURCE_RESULT}" = "success"
          test "${SKILL_TESTS_RESULT}" = "success"
