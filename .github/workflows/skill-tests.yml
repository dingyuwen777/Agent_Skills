            ! grep -Fq "${forbidden}" "${no_args_target}/AGENTS.md"
          done
          grep -Fq "必须先读取并遵守当前目录及上级适用的项目规则" "${no_args_target}/AGENTS.md"
          grep -Fq ".agents/project-context.json" "${no_args_target}/.gitignore"
          ! grep -Fq "/.agents/runtime/" "${no_args_target}/.gitignore"

  runtime-package-gate:
    name: Runtime Package Gate
    if: always()
    needs:
      - agent-skills-core
      - runtime-windows-package
      - runtime-macos-package
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required Runtime package evidence
        shell: bash
        env:
          CORE_RESULT: ${{ needs.agent-skills-core.result }}
          RUNTIME_SCOPE: ${{ needs.agent-skills-core.outputs.runtime_scope }}
          WINDOWS_RESULT: ${{ needs.runtime-windows-package.result }}
          MACOS_RESULT: ${{ needs.runtime-macos-package.result }}
        run: |
          set -euo pipefail
          test "${CORE_RESULT}" = "success"
          case "${RUNTIME_SCOPE}" in
            governance|content)
              test "${WINDOWS_RESULT}" = "skipped"
              test "${MACOS_RESULT}" = "skipped"
              ;;
            package)
              test "${WINDOWS_RESULT}" = "success"
              test "${MACOS_RESULT}" = "success"
              ;;
            *)
              echo "Unknown runtime_scope value: ${RUNTIME_SCOPE}" >&2
              exit 1
              ;;
          esac
