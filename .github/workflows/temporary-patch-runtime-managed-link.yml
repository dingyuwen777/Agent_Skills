name: Temporary Patch Runtime Managed Link

on:
  push:
    branches:
      - chore/clickable-markdown-navigation
    paths:
      - '.github/scripts/temporary_patch_runtime_managed_link.py'
      - '.github/workflows/temporary-patch-runtime-managed-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/clickable-markdown-navigation
          fetch-depth: 0
      - name: Patch Runtime managed link
        run: python3 .github/scripts/temporary_patch_runtime_managed_link.py
      - name: Validate patch
        run: |
          git diff --check
          python3 -m py_compile runtime/agent_skills_runtime/project_installer.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/agent_skills_runtime/project_installer.py
          git diff --cached --check
          git commit -m '兼容最小 Payload 的可点击导航转换'
          git push origin HEAD:chore/clickable-markdown-navigation
