          git push origin HEAD:main\t\.github/workflows/(tmp-fix238-ready|_ci238_canary_cleanup|_ci238_apply|_maintenance_patch|runtime-package-tests|temporary-sync-runtime-package-gitignore|temporary-apply-runtime-gitignore-fix|_temporary_target_issue_contract|_temporary_issue_closure_preservation_fix|_temporary_issue_acceptance_contract_migration|runtime-name-migration)\.yml\t'             > "${remaining_file}" || true

          if [[ -s "${remaining_file}" ]]; then
            echo "仍存在废弃 Workflow 历史 run：" >&2
            cat "${remaining_file}" >&2
            exit 1
          fi

          echo "Obsolete workflow history cleaned."

