name: Change Archive

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths: [".agents/changes/active/**"]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 已合并到 main 的 Implementation PR 编号
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: change-archive-main
  cancel-in-progress: false

jobs:


  cleanup-obsolete-workflow-runs:
    name: Cleanup obsolete workflow history
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          contains(github.event.head_commit.message, '清理废弃 Actions 历史') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete obsolete workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs_file="${RUNNER_TEMP}/all-workflow-runs.tsv"
          gh api --paginate             "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             --jq '.workflow_runs[] | [.id, .path, .name] | @tsv'             > "${runs_file}"

          deleted=0
          while IFS=    name: Archive merged Change
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    environment: change-archive-main
    steps:
      - name: Detect archive App configuration
        id: configured
        env:
          APP_ID: ${{ secrets.CHANGE_ARCHIVE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CHANGE_ARCHIVE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Change Archive 尚未配置专用 GitHub App；本次安全 no-op。配置 change-archive-main Environment 后可用 workflow_dispatch 按 merged PR 重跑。"
          fi

      - name: Mint narrow archive App token
        if: steps.configured.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CHANGE_ARCHIVE_APP_ID }}
          private-key: ${{ secrets.CHANGE_ARCHIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout current main
        if: steps.configured.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Resolve merged PR facts
        if: steps.configured.outputs.configured == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${EVENT_PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "缺少 merged PR 编号" >&2
            exit 1
          fi

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          MERGED="$(jq -r '.merged' <<<"${PR_JSON}")"
          BASE_REF="$(jq -r '.base.ref' <<<"${PR_JSON}")"
          MERGED_AT="$(jq -r '.merged_at // empty' <<<"${PR_JSON}")"
          MERGE_SHA="$(jq -r '.merge_commit_sha // empty' <<<"${PR_JSON}")"
          if [[ "${MERGED}" != "true" || "${BASE_REF}" != "main" || -z "${MERGED_AT}" || -z "${MERGE_SHA}" ]]; then
            echo "PR #${PR_NUMBER} 不是可唯一绑定 revision 的已合并 main Implementation PR" >&2
            exit 1
          fi

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${RUNNER_TEMP}/change-archive-paths.txt"

          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "merged_at=${MERGED_AT}" >> "${GITHUB_OUTPUT}"
          echo "merge_sha=${MERGE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Archive Change deterministically
        if: steps.configured.outputs.configured == 'true'
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/archive_change_after_merge.py \
            --root . \
            --pr-number "${{ steps.pr.outputs.number }}" \
            --merged-at "${{ steps.pr.outputs.merged_at }}" \
            --merged-revision "${{ steps.pr.outputs.merge_sha }}" \
            --changed-paths-file "${RUNNER_TEMP}/change-archive-paths.txt" \
            --json | tee "${RUNNER_TEMP}/change-archive-result.json"

          echo "changed=$(jq -r '.changed' "${RUNNER_TEMP}/change-archive-result.json")" >> "${GITHUB_OUTPUT}"
          echo "change_id=$(jq -r '.change_id // empty' "${RUNNER_TEMP}/change-archive-result.json")" >> "${GITHUB_OUTPUT}"
          echo "source=$(jq -r '.source // empty' "${RUNNER_TEMP}/change-archive-result.json")" >> "${GITHUB_OUTPUT}"
          echo "target=$(jq -r '.target // empty' "${RUNNER_TEMP}/change-archive-result.json")" >> "${GITHUB_OUTPUT}"

      - name: Verify archive gate and exact diff allowlist
        if: steps.configured.outputs.configured == 'true' && steps.archive.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/coding/scripts/ready_check.py --root .

          SOURCE="${{ steps.archive.outputs.source }}"
          TARGET="${{ steps.archive.outputs.target }}"
          RECOVERY=false

          case "${SOURCE}" in
            .agents/changes/active/*/CHANGE.md)
              ;;
            changes/active/*/CHANGE.md)
              RECOVERY=true
              if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
                echo "归档 source/target carrier 不满足允许边界" >&2
                exit 1
              fi
              ;;
            *)
              echo "归档 source/target carrier 不满足允许边界" >&2
              exit 1
              ;;
          esac
          case "${TARGET}" in
            .agents/changes/archive/*/*/CHANGE.md)
              ;;
            *)
              echo "归档 source/target carrier 不满足允许边界" >&2
              exit 1
              ;;
          esac

          git add -A -- "${SOURCE}" "${TARGET}"
          mapfile -t ACTUAL < <(git diff --cached --name-only --no-renames | sort)
          mapfile -t EXPECTED < <(printf '%s\n%s\n' "${SOURCE}" "${TARGET}" | sort)

          if [[ "${#ACTUAL[@]}" -ne 2 || "${ACTUAL[*]}" != "${EXPECTED[*]}" ]]; then
            echo "归档 staged diff 超出单一 Change allowlist" >&2
            printf 'actual: %s\n' "${ACTUAL[@]}" >&2
            printf 'expected: %s\n' "${EXPECTED[@]}" >&2
            exit 1
          fi

          if [[ "${RECOVERY}" == "true" ]]; then
            ALLOWED_PATTERN='^(changes/active/|\.agents/changes/archive/)'
          else
            ALLOWED_PATTERN='^\.agents/changes/(active|archive)/'
          fi
          if git diff --cached --name-only --no-renames | grep -Ev "${ALLOWED_PATTERN}" >/dev/null; then
            echo "归档 diff 出现 Change carrier 之外路径" >&2
            exit 1
          fi

      - name: Commit and push archive to main
        if: steps.configured.outputs.configured == 'true' && steps.archive.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent Skills Change Archivist"
          git config user.email "agent-skills-change-archivist@users.noreply.github.com"
          git commit -m "归档 Change：${{ steps.archive.outputs.change_id }} [skip ci]"

          ARCHIVE_PARENT="$(git rev-parse HEAD^)"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "${ARCHIVE_PARENT}" != "${CURRENT_MAIN}" ]]; then
            echo "main 在归档期间发生漂移；停止 push，请重跑 Change Archive" >&2
            exit 1
          fi

          git push origin HEAD:main\t' read -r run_id workflow_path workflow_name; do
            case "${workflow_path}" in
              ".github/workflows/tmp-fix238-ready.yml"|              ".github/workflows/_ci238_canary_cleanup.yml"|              ".github/workflows/_ci238_apply.yml"|              ".github/workflows/_maintenance_patch.yml"|              ".github/workflows/runtime-package-tests.yml"|              ".github/workflows/temporary-sync-runtime-package-gitignore.yml"|              ".github/workflows/temporary-apply-runtime-gitignore-fix.yml"|              ".github/workflows/_temporary_target_issue_contract.yml"|              ".github/workflows/_temporary_issue_closure_preservation_fix.yml"|              ".github/workflows/_temporary_issue_acceptance_contract_migration.yml"|              ".github/workflows/runtime-name-migration.yml")
                echo "delete run=${run_id} workflow=${workflow_name} path=${workflow_path}"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
                deleted=$((deleted + 1))
                ;;
            esac
          done < "${runs_file}"

          echo "deleted=${deleted}" >> "${GITHUB_STEP_SUMMARY}"

          remaining_file="${RUNNER_TEMP}/remaining-obsolete-runs.tsv"
          gh api --paginate             "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             --jq '.workflow_runs[] | [.id, .path, .name] | @tsv'             | grep -E     name: Archive merged Change
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    environment: change-archive-main
    steps:
      - name: Detect archive App configuration
        id: configured
        env:
          APP_ID: ${{ secrets.CHANGE_ARCHIVE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CHANGE_ARCHIVE_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${APP_ID}" && -n "${APP_PRIVATE_KEY}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Change Archive 尚未配置专用 GitHub App；本次安全 no-op。配置 change-archive-main Environment 后可用 workflow_dispatch 按 merged PR 重跑。"
          fi

      - name: Mint narrow archive App token
        if: steps.configured.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
