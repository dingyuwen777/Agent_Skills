          git config user.email "agent-skills-change-archivist@users.noreply.github.com"
          git commit -m "归档 Change：${{ steps.archive.outputs.change_id }} [skip ci]"

          ARCHIVE_PARENT="$(git rev-parse HEAD^)"
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          if [[ "${ARCHIVE_PARENT}" != "${CURRENT_MAIN}" ]]; then
            echo "main 在归档期间发生漂移；停止 push，请重跑 Change Archive" >&2
            exit 1
          fi

          git push origin HEAD:main