name: Temporary Source Mode Compact

on:
  push:
    branches:
      - chore/source-mode-installed-assets-noncanonical

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/source-mode-installed-assets-noncanonical
          fetch-depth: 0
      - name: Compact canonical Source Mode rules
        run: python .agents/changes/active/CHG-20260901-source-mode-installed-assets-noncanonical/compact_patch.py
      - name: Verify targeted semantics and context budget
        run: |
          git diff --check
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_source_mode_installed_assets_noncanonical.py' -v
          python -m unittest discover -s .agents/skills/coding/tests -p 'test_router_skill_migration.py' -v
      - name: Commit compact rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/skills/router/SKILL.md .agents/skills/coding/references/12_目标项目安装与AGENTS_Bootstrap.md .agents/skills/coding/references/13_本地MCP_Runtime分发与原文上下文加载.md
          git commit -m "收敛Source Mode防误用规则重复"
          git push origin HEAD:chore/source-mode-installed-assets-noncanonical
